<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Vertex Tutorial Centre</title>
  <meta name="description" content="Computer-Based Testing System for Vertex Tutorial students." />
  <meta name="author" content="Vertex Tutorial" />

  <meta name="theme-color" content="#0d0d0f" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f7f7f8" media="(prefers-color-scheme: light)" />
  <meta name="color-scheme" content="light dark" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="VertexCBT" />
  <link rel="apple-touch-icon" href="vertex.jpeg" />
  <link rel="apple-touch-icon" sizes="152x152" href="vertex.jpeg" />
  <link rel="apple-touch-icon" sizes="144x144" href="vertex.jpeg" />
  <link rel="apple-touch-icon" sizes="128x128" href="vertex.jpeg" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="vertex.jpeg" type="image/png" />

  <!-- Geist font from Google Fonts CDN alternative -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link rel="stylesheet" href="news-ticker.css" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/studyroom.css" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    if (window.tailwind) {
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Geist', 'DM Sans', 'system-ui', '-apple-system', 'sans-serif'],
            },
          },
        },
        corePlugins: { preflight: false },
      };
    }
  </script>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
          onload="window._katexAutoRenderReady = true;"></script>

  <style>
    /* ── Dark mode bootstrap (runs before CSS loads to prevent flash) ── */
    (function() {
      const stored = localStorage.getItem('vtx-theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (stored === 'dark' || (!stored && prefersDark)) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </style>

  <style>
    /* ── Loading screen ── */
    #vtx-loader {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: #0d0d0f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Geist', 'DM Sans', system-ui, sans-serif;
      transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      opacity: 1;
      visibility: visible;
    }

    #vtx-loader.is-done {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .vtx-loader-mark {
      width: 44px;
      height: 44px;
      background: #4f6ef7;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.5rem;
      box-shadow: 0 8px 24px rgba(79, 110, 247, 0.35);
      animation: vtx-mark-pulse 2.4s ease-in-out infinite;
    }

    @keyframes vtx-mark-pulse {
      0%, 100% { box-shadow: 0 8px 24px rgba(79, 110, 247, 0.35); }
      50%       { box-shadow: 0 8px 32px rgba(79, 110, 247, 0.55); transform: scale(1.03); }
    }

    .vtx-loader-title {
      font-size: 1.0625rem;
      font-weight: 600;
      letter-spacing: -0.015em;
      color: #f0f0f2;
      margin-bottom: 0.25rem;
      text-align: center;
    }

    .vtx-loader-subtitle {
      font-size: 0.6875rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(180, 180, 192, 0.4);
      margin-bottom: 2rem;
      text-align: center;
    }

    .vtx-loader-track {
      width: 160px;
      height: 2px;
      background: rgba(255,255,255,.06);
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 1rem;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .vtx-loader-bar {
      height: 100%;
      width: 0%;
      border-radius: 99px;
      background: #4f6ef7;
      transition: width 0.4s ease;
    }

    .vtx-loader-status {
      font-size: 0.6875rem;
      letter-spacing: 0.06em;
      color: rgba(160, 160, 175, 0.45);
      text-align: center;
      min-height: 1em;
      transition: opacity 0.3s ease;
    }

    .vtx-dots {
      display: flex;
      gap: 5px;
      align-items: center;
      justify-content: center;
      margin-bottom: 0.75rem;
    }

    .vtx-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: rgba(79, 110, 247, 0.5);
      animation: vtx-dot-pulse 1.4s ease-in-out infinite;
    }

    .vtx-dot:nth-child(2) { animation-delay: 0.22s; }
    .vtx-dot:nth-child(3) { animation-delay: 0.44s; }

    @keyframes vtx-dot-pulse {
      0%, 80%, 100% { transform: scale(1);   opacity: 0.4; }
      40%            { transform: scale(1.6); opacity: 1;   }
    }

    /* ── Theme toggle button ── */
    #themeToggle {
      position: fixed;
      bottom: 16px;
      left: 16px;
      z-index: 9998;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-4);
      transition: background 0.14s, color 0.14s, border-color 0.14s;
      box-shadow: var(--shadow-sm);
    }

    #themeToggle:hover {
      background: var(--bg-muted);
      color: var(--text-1);
      border-color: var(--border-strong);
    }

    .theme-icon-dark  { display: block; }
    .theme-icon-light { display: none; }

    [data-theme="dark"] .theme-icon-dark  { display: none; }
    [data-theme="dark"] .theme-icon-light { display: block; }
  </style>
</head>

<body>

  <!-- Dark mode bootstrap script (must be synchronous) -->
  <script>
    (function() {
      const stored = localStorage.getItem('vtx-theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (stored === 'dark' || (!stored && prefersDark)) {
        document.documentElement.setAttribute('data-theme', 'dark');
      } else {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>

  <!-- Loading screen -->
  <div id="vtx-loader" role="status" aria-label="Loading Vertex Tutorial">
    <div class="vtx-loader-mark">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white"
           stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="12 2 22 8.5 22 15.5 12 22 2 15.5 2 8.5 12 2"/>
        <line x1="12" y1="22" x2="12" y2="15.5"/>
        <polyline points="22 8.5 12 15.5 2 8.5"/>
      </svg>
    </div>
    <div class="vtx-loader-title">Vertex Tutorial</div>
    <div class="vtx-loader-subtitle">Computer-Based Testing</div>
    <div class="vtx-dots" id="vtxDots">
      <div class="vtx-dot"></div>
      <div class="vtx-dot"></div>
      <div class="vtx-dot"></div>
    </div>
    <div class="vtx-loader-track" id="vtxTrack">
      <div class="vtx-loader-bar" id="vtxBar"></div>
    </div>
    <div class="vtx-loader-status" id="vtxStatus">Preparing your session&hellip;</div>
  </div>

  <!-- Theme toggle -->
  <button id="themeToggle" aria-label="Toggle dark mode" onclick="VtxTheme.toggle()">
    <!-- Sun (shown in dark mode) -->
    <svg class="theme-icon-light" width="16" height="16" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="5"/>
      <line x1="12" y1="1" x2="12" y2="3"/>
      <line x1="12" y1="21" x2="12" y2="23"/>
      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
      <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
      <line x1="1" y1="12" x2="3" y2="12"/>
      <line x1="21" y1="12" x2="23" y2="12"/>
      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
      <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
    </svg>
    <!-- Moon (shown in light mode) -->
    <svg class="theme-icon-dark" width="16" height="16" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>
  </button>

  <!-- Toast container -->
  <div id="toastContainer" aria-live="polite" aria-atomic="false" role="status"></div>

  <!-- Main app mount -->
  <div id="app"></div>

  <!-- PWA Install Prompt -->
  <div id="install-prompt"
       style="display:none;position:fixed;bottom:16px;left:50%;transform:translateX(-50%);
              background:var(--bg-base);padding:1rem 1.5rem;border-radius:var(--r-xl);
              box-shadow:var(--shadow-xl);z-index:9999;max-width:90%;text-align:center;
              border:1px solid var(--border);">
    <p style="margin:0 0 10px;font-weight:600;color:var(--text-1);font-size:0.875rem;">
      Install Vertex Tutorial App
    </p>
    <div style="display:flex;gap:8px;justify-content:center;">
      <button id="install-button"
              style="background:var(--accent);color:white;border:none;padding:6px 16px;
                     border-radius:var(--r-md);font-weight:600;cursor:pointer;
                     font-family:var(--font);font-size:0.8125rem;">
        Install
      </button>
      <button id="install-cancel"
              style="background:var(--bg-subtle);color:var(--text-2);border:1px solid var(--border);
                     padding:6px 16px;border-radius:var(--r-md);cursor:pointer;
                     font-family:var(--font);font-size:0.8125rem;">
        Later
      </button>
    </div>
  </div>

  <!-- Loader controller -->
  <script>
    (function () {
      'use strict';

      var _bar    = document.getElementById('vtxBar');
      var _track  = document.getElementById('vtxTrack');
      var _status = document.getElementById('vtxStatus');
      var _dots   = document.getElementById('vtxDots');
      var _loader = document.getElementById('vtx-loader');
      var _pct    = 0;
      var _isDone = false;

      function _setProgress(pct, label) {
        if (_isDone) return;
        _pct = Math.min(100, Math.max(0, pct));
        if (_pct > 0 && _track) {
          _track.style.opacity = '1';
          if (_dots) _dots.style.opacity = '0';
        }
        if (_bar)    _bar.style.width  = _pct + '%';
        if (_status && label) _status.textContent = label;
      }

      function _done() {
        if (_isDone) return;
        _isDone = true;
        _setProgress(100, 'Ready');
        setTimeout(function () {
          if (_loader) _loader.classList.add('is-done');
          setTimeout(function () {
            if (_loader && _loader.parentNode) _loader.parentNode.removeChild(_loader);
          }, 600);
        }, 260);
      }

      window.VtxLoader = { progress: _setProgress, done: _done };

      setTimeout(function () {
        if (!_isDone) { console.warn('[VtxLoader] Failsafe triggered.'); _done(); }
      }, 12000);
    }());
  </script>

  <!-- Theme controller -->
  <script>
    (function () {
      'use strict';

      function _apply(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('vtx-theme', theme);
      }

      function toggle() {
        const current = document.documentElement.getAttribute('data-theme') || 'light';
        _apply(current === 'dark' ? 'light' : 'dark');
      }

      /* Sync with OS preference changes */
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function (e) {
        if (!localStorage.getItem('vtx-theme')) {
          _apply(e.matches ? 'dark' : 'light');
        }
      });

      window.VtxTheme = { toggle: toggle, apply: _apply };
    }());
  </script>

  <!-- CSS variable bridge for data-theme attribute -->
  <style>
    [data-theme="dark"] {
      --bg-base:        #111113;
      --bg-page:        #0d0d0f;
      --bg-subtle:      #18181b;
      --bg-muted:       #222226;
      --bg-overlay:     rgba(0, 0, 0, 0.72);
      --border:         #2a2a30;
      --border-strong:  #3a3a42;
      --text-1:         #f0f0f2;
      --text-2:         #c4c4cc;
      --text-3:         #86868f;
      --text-4:         #56565e;
      --text-inverse:   #0d0d0f;
      --accent:         #6b87f8;
      --accent-hover:   #5a78f6;
      --accent-active:  #4f6ef7;
      --accent-subtle:  rgba(107, 135, 248, 0.1);
      --accent-border:  rgba(107, 135, 248, 0.28);
      --accent-text:    #8da2fa;
      --success:        #22c45e;
      --success-subtle: rgba(34, 196, 94, 0.1);
      --success-border: rgba(34, 196, 94, 0.25);
      --success-text:   #4ade80;
      --danger:         #f05050;
      --danger-subtle:  rgba(240, 80, 80, 0.1);
      --danger-border:  rgba(240, 80, 80, 0.25);
      --danger-text:    #fca5a5;
      --warning:        #f59e0b;
      --warning-subtle: rgba(245, 158, 11, 0.1);
      --warning-border: rgba(245, 158, 11, 0.25);
      --warning-text:   #fcd34d;
      --shadow-xs: 0 1px 2px rgba(0,0,0,.3);
      --shadow-sm: 0 1px 3px rgba(0,0,0,.4), 0 1px 2px rgba(0,0,0,.3);
      --shadow-md: 0 4px 12px rgba(0,0,0,.4), 0 2px 4px rgba(0,0,0,.3);
      --shadow-lg: 0 8px 24px rgba(0,0,0,.5), 0 4px 8px rgba(0,0,0,.3);
      --shadow-xl: 0 16px 40px rgba(0,0,0,.6), 0 6px 12px rgba(0,0,0,.3);
      --shadow-accent: 0 4px 14px rgba(107, 135, 248, 0.3);
      color-scheme: dark;
    }

    [data-theme="light"] {
      color-scheme: light;
    }
  </style>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-messaging-compat.js"></script>

  <!-- Application modules -->
  <script src="data/questions.js"></script>
  <script src="js/config.js"></script>
  <script src="js/state.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/dm.js"></script>

  <script src="js/teacher.js"></script>

  <!-- Presentation enhancements -->
  <script>
    (function () {
      'use strict';

      function _patchExam() {
        if (!window.Exam || typeof window.Exam.renderExam !== 'function') {
          return setTimeout(_patchExam, 80);
        }
        var _orig = window.Exam.renderExam;
        window.Exam.renderExam = function () {
          _orig.apply(this, arguments);
          _setExamLayout(true);
          _stickyTimer();
        };
      }

      function _patchMount() {
        if (!window.UI || typeof window.UI.mount !== 'function') {
          return setTimeout(_patchMount, 80);
        }
        var _orig = window.UI.mount;
        window.UI.mount = function (html) {
          _orig.call(this, html);
          var inExam = window.AppState &&
                       window.AppState.exam &&
                       window.AppState.exam.step === 'exam';
          if (!inExam) _setExamLayout(false);
        };
      }

      function _setExamLayout(active) {
        var app = document.getElementById('app');
        if (!app) return;
        if (active) {
          app.style.display        = 'block';
          app.style.alignItems     = '';
          app.style.justifyContent = '';
          app.style.padding        = '0.75rem';
          app.classList.add('exam-active');
        } else {
          app.style.display        = '';
          app.style.alignItems     = '';
          app.style.justifyContent = '';
          app.style.padding        = '';
          app.classList.remove('exam-active');
        }
      }

      function _stickyTimer() {
        var app = document.getElementById('app');
        if (!app) return;
        var wrap = app.firstElementChild;
        if (!wrap) return;

        var header = wrap.querySelector('.glass:has(#timerDisplay)');
        if (!header) {
          header = Array.from(wrap.children).find(function (el) {
            return el.classList.contains('glass') && el.querySelector('#timerDisplay');
          });
        }
        if (!header) return;
        if (header.classList.contains('exam-header-sticky')) return;

        header.classList.add('exam-header-sticky');

        if (!('IntersectionObserver' in window)) return;
        var sentinel = document.createElement('div');
        sentinel.style.cssText = 'height:1px;pointer-events:none;visibility:hidden;';
        wrap.insertBefore(sentinel, header);

        if (window._stickyObs) window._stickyObs.disconnect();
        window._stickyObs = new IntersectionObserver(function (entries) {
          var el = document.querySelector('.exam-header-sticky');
          if (!el) return;
          el.classList.toggle('stuck', !entries[0].isIntersecting);
        }, { threshold: [0], rootMargin: '-1px 0px 0px 0px' });
        window._stickyObs.observe(sentinel);
      }

      document.addEventListener('keydown', function (e) {
        var tag = document.activeElement && document.activeElement.tagName;
        if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
        var exam = window.AppState && window.AppState.exam;
        if (!exam || exam.step !== 'exam') return;

        if (e.key === 'ArrowRight' || e.key === 'n' || e.key === 'N') {
          e.preventDefault();
          window.Exam && window.Exam.nextQuestion();
        } else if (e.key === 'ArrowLeft' || e.key === 'p' || e.key === 'P') {
          e.preventDefault();
          window.Exam && window.Exam.prevQuestion();
        } else if (e.key >= '1' && e.key <= '5') {
          var idx = parseInt(e.key, 10) - 1;
          var radios = document.querySelectorAll('input[name="option"]');
          if (radios[idx]) {
            radios[idx].checked = true;
            radios[idx].dispatchEvent(new Event('change', { bubbles: true }));
          }
        }
      });

      document.addEventListener('DOMContentLoaded', function () {
        _patchExam();
        _patchMount();
      });
    }());
  </script>

  <!-- Service Worker -->
  <script>
    (function () {
      'use strict';

      if (!('serviceWorker' in navigator)) return;

      var _swUpdateReady  = false;
      var _swRegistration = null;

      function _registerSW() {
        navigator.serviceWorker
          .register('/sw.js', { scope: '/' })
          .then(function (reg) {
            _swRegistration = reg;
            console.log('[SW] Registered. Scope:', reg.scope);
            if (reg.waiting) _onUpdateReady(reg.waiting);
            reg.addEventListener('updatefound', function () {
              var nw = reg.installing;
              if (!nw) return;
              nw.addEventListener('statechange', function () {
                if (nw.state === 'installed' && navigator.serviceWorker.controller) {
                  _onUpdateReady(nw);
                }
              });
            });
          })
          .catch(function (err) { console.error('[SW] Registration failed:', err); });

        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (_swUpdateReady) window.location.reload();
        });
      }

      function _onUpdateReady(worker) {
        _swUpdateReady = true;
        function _show() {
          if (window.UI && typeof window.UI.showUpdateToast === 'function') {
            window.UI.showUpdateToast(function () {
              if (worker) worker.postMessage({ type: 'SKIP_WAITING' });
            });
          } else {
            setTimeout(_show, 500);
          }
        }
        _show();
      }

      if (document.readyState === 'loading') {
        window.addEventListener('load', _registerSW);
      } else {
        setTimeout(_registerSW, 0);
      }
    }());
  </script>

</body>
</html>
