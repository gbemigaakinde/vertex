  <style>
    /* ══════════════════════════════════════════════════════
       VERTEX CBT — LOADING SCREEN
       Fonts: Instrument Serif + DM Sans
       Accent: #4f6ef7 (indigo, matches --accent in main.css)
    ══════════════════════════════════════════════════════ */
    @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap');

    /* ── Loader shell ── */
    #vtx-loader {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: #fafaf8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'DM Sans', system-ui, sans-serif;
      transition: opacity 0.55s cubic-bezier(0.4, 0, 0.2, 1),
                  visibility 0.55s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #vtx-loader::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 80% 60% at 50% 50%,
        transparent 40%, rgba(14,14,15,0.03) 100%);
      pointer-events: none;
    }

    #vtx-loader.is-done {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    [data-theme="dark"] #vtx-loader { background: #111113; }
    [data-theme="dark"] #vtx-loader::before {
      background: radial-gradient(ellipse 80% 60% at 50% 50%,
        rgba(79,110,247,0.05) 0%, transparent 60%);
    }

    /* ══════════════════════════════════════════════════════
       BOOK — completely rewritten for reliable centering
    ══════════════════════════════════════════════════════ */

    .vtx-book-scene {
      position: relative;
      width: 320px;
      height: 160px;
      margin-bottom: 2.75rem;
      perspective: 900px;
      perspective-origin: 50% 50%;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .vtx-book {
      position: relative;
      width: 140px;
      height: 120px;
      transform-style: preserve-3d;
      animation: vtx-book-shift 2.6s cubic-bezier(0.45,0,0.15,1) 0.4s both;
      flex-shrink: 0;
    }

    @keyframes vtx-book-shift {
      0%   { transform: translateX(0); }
      100% { transform: translateX(52px); }
    }

    /* ── Back cover ── */
    .vtx-book-back {
      position: absolute;
      inset: 0;
      background: linear-gradient(140deg, #1c1c20 0%, #0e0e0f 100%);
      border-radius: 3px 10px 10px 3px;
      box-shadow:
        0 8px 28px rgba(14,14,15,0.18),
        0 2px 6px rgba(14,14,15,0.12);
    }
    [data-theme="dark"] .vtx-book-back {
      background: linear-gradient(140deg, #2a2a30 0%, #18181b 100%);
    }

    /* ── Spine strip ── */
    .vtx-book-spine {
      position: absolute;
      left: -12px;
      top: 0;
      width: 12px;
      height: 100%;
      background: linear-gradient(180deg, #2a2a30 0%, #0e0e0f 100%);
      border-radius: 3px 0 0 3px;
      box-shadow: -3px 4px 12px rgba(14,14,15,0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    [data-theme="dark"] .vtx-book-spine {
      background: linear-gradient(180deg, #3a3a42 0%, #18181b 100%);
    }

    .vtx-spine-line {
      width: 2px;
      border-radius: 1px;
      background: rgba(79,110,247,0.4);
    }

    /* ── Front cover — rotates open around spine (left edge) ── */
    .vtx-book-front {
      position: absolute;
      inset: 0;
      background: linear-gradient(140deg, #1c1c20 0%, #0e0e0f 100%);
      border-radius: 3px 10px 10px 3px;
      transform-origin: left center;
      transform-style: preserve-3d;
      animation: vtx-cover-open 2.6s cubic-bezier(0.45,0,0.15,1) 0.4s both;
      z-index: 10;
    }
    [data-theme="dark"] .vtx-book-front {
      background: linear-gradient(140deg, #2a2a30 0%, #18181b 100%);
    }

    .vtx-book-front::before {
      content: '';
      position: absolute;
      inset: 7px;
      border: 1px solid rgba(79,110,247,0.22);
      border-radius: 2px 8px 8px 2px;
    }

    .vtx-cover-title {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      backface-visibility: hidden;
    }
    .vtx-cover-wordmark {
      font-family: 'Instrument Serif', Georgia, serif;
      font-size: 0.75rem;
      font-style: italic;
      color: rgba(250,250,248,0.75);
      letter-spacing: 0.04em;
      text-align: center;
      line-height: 1.3;
      padding: 0 14px;
    }
    .vtx-cover-rule {
      width: 36px;
      height: 1px;
      background: rgba(79,110,247,0.45);
    }
    .vtx-cover-sub {
      font-size: 0.4375rem;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: rgba(79,110,247,0.55);
    }

    /* ── Pages ── */
    .vtx-page {
      position: absolute;
      inset: 0;
      border-radius: 3px 10px 10px 3px;
      transform-origin: left center;
      transform-style: preserve-3d;
    }

    .vtx-page::after {
      content: '';
      position: absolute;
      top: 14px; left: 14px; right: 10px; bottom: 14px;
      background: repeating-linear-gradient(
        to bottom,
        transparent, transparent 9px,
        rgba(14,14,15,0.07) 9px, rgba(14,14,15,0.07) 10px
      );
      border-radius: 0 4px 4px 0;
    }
    [data-theme="dark"] .vtx-page::after {
      background: repeating-linear-gradient(
        to bottom,
        transparent, transparent 9px,
        rgba(250,250,248,0.07) 9px, rgba(250,250,248,0.07) 10px
      );
    }

    .vtx-page-1 { background: linear-gradient(90deg,#f0ede6,#ece8e0); animation: vtx-page-fan-1 2.6s cubic-bezier(0.45,0,0.15,1) 0.45s both; z-index:9; }
    .vtx-page-2 { background: linear-gradient(90deg,#f2efe8,#eeeae2); animation: vtx-page-fan-2 2.6s cubic-bezier(0.45,0,0.15,1) 0.50s both; z-index:8; }
    .vtx-page-3 { background: linear-gradient(90deg,#f3f0e9,#efebe3); animation: vtx-page-fan-3 2.6s cubic-bezier(0.45,0,0.15,1) 0.55s both; z-index:7; }
    .vtx-page-4 { background: linear-gradient(90deg,#f4f1ea,#f0ece4); animation: vtx-page-fan-4 2.6s cubic-bezier(0.45,0,0.15,1) 0.60s both; z-index:6; }
    .vtx-page-5 { background: linear-gradient(90deg,#f5f2eb,#f1ede5); animation: vtx-page-fan-5 2.6s cubic-bezier(0.45,0,0.15,1) 0.65s both; z-index:5; }
    .vtx-page-6 { background: linear-gradient(90deg,#f6f3ec,#f2eee6); animation: vtx-page-fan-6 2.6s cubic-bezier(0.45,0,0.15,1) 0.70s both; z-index:4; }

    [data-theme="dark"] .vtx-page-1 { background: linear-gradient(90deg,#2a2a30,#222228); }
    [data-theme="dark"] .vtx-page-2 { background: linear-gradient(90deg,#2c2c32,#242429); }
    [data-theme="dark"] .vtx-page-3 { background: linear-gradient(90deg,#2e2e34,#26262b); }
    [data-theme="dark"] .vtx-page-4 { background: linear-gradient(90deg,#303036,#28282d); }
    [data-theme="dark"] .vtx-page-5 { background: linear-gradient(90deg,#323238,#2a2a2f); }
    [data-theme="dark"] .vtx-page-6 { background: linear-gradient(90deg,#34343a,#2c2c31); }

    @keyframes vtx-cover-open {
      0%   { transform: rotateY(0deg); }
      100% { transform: rotateY(-160deg); }
    }

    @keyframes vtx-page-fan-1 { 0%{transform:rotateY(0deg)} 100%{transform:rotateY(-138deg)} }
    @keyframes vtx-page-fan-2 { 0%{transform:rotateY(0deg)} 100%{transform:rotateY(-116deg)} }
    @keyframes vtx-page-fan-3 { 0%{transform:rotateY(0deg)} 100%{transform:rotateY(-94deg)}  }
    @keyframes vtx-page-fan-4 { 0%{transform:rotateY(0deg)} 100%{transform:rotateY(-72deg)}  }
    @keyframes vtx-page-fan-5 { 0%{transform:rotateY(0deg)} 100%{transform:rotateY(-50deg)}  }
    @keyframes vtx-page-fan-6 { 0%{transform:rotateY(0deg)} 100%{transform:rotateY(-30deg)}  }

    .vtx-book-shadow {
      position: absolute;
      bottom: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 200px;
      height: 20px;
      background: radial-gradient(ellipse, rgba(14,14,15,0.16) 0%, transparent 70%);
      animation: vtx-shadow-spread 2.6s cubic-bezier(0.45,0,0.15,1) 0.4s both;
      pointer-events: none;
    }
    [data-theme="dark"] .vtx-book-shadow {
      background: radial-gradient(ellipse, rgba(0,0,0,0.5) 0%, transparent 70%);
    }
    @keyframes vtx-shadow-spread {
      0%   { width: 150px; opacity: 0.3; }
      100% { width: 260px; opacity: 1; }
    }

    /* ── Wordmark ── */
    .vtx-loader-text {
      text-align: center;
      margin-bottom: 2rem;
      animation: vtx-fade-up 0.5s ease 0.3s both;
    }
    .vtx-loader-title {
      font-family: 'Instrument Serif', Georgia, serif;
      font-size: 1.25rem;
      font-style: italic;
      font-weight: 400;
      color: #0e0e0f;
      letter-spacing: -0.01em;
      margin-bottom: 0.2rem;
    }
    [data-theme="dark"] .vtx-loader-title { color: rgba(250,250,248,0.9); }
    .vtx-loader-subtitle {
      font-size: 0.5625rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #a4a4aa;
    }

    /* ── Progress ── */
    .vtx-progress-wrap {
      width: 200px;
      animation: vtx-fade-up 0.5s ease 0.5s both;
    }
    .vtx-loader-track {
      width: 100%;
      height: 2px;
      background: #e4e2dc;
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 0.75rem;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    [data-theme="dark"] .vtx-loader-track { background: #2a2a30; }
    .vtx-loader-bar {
      height: 100%;
      width: 0%;
      border-radius: 99px;
      background: #4f6ef7;
      transition: width 0.45s ease;
      box-shadow: 0 0 8px rgba(79,110,247,0.4);
    }
    .vtx-loader-status {
      font-size: 0.625rem;
      letter-spacing: 0.08em;
      color: #a4a4aa;
      text-align: center;
      min-height: 1em;
      transition: opacity 0.3s ease;
    }

    /* ── Idle dots ── */
    .vtx-dots {
      display: flex; gap: 5px;
      align-items: center; justify-content: center;
      margin-bottom: 0.625rem;
    }
    .vtx-dot {
      width: 3px; height: 3px; border-radius: 50%;
      background: rgba(79,110,247,0.5);
      animation: vtx-dot-pulse 1.5s ease-in-out infinite;
    }
    .vtx-dot:nth-child(2) { animation-delay: 0.22s; }
    .vtx-dot:nth-child(3) { animation-delay: 0.44s; }

    @keyframes vtx-dot-pulse {
      0%,80%,100% { transform:scale(1);   opacity:0.35; }
      40%          { transform:scale(1.8); opacity:1;    }
    }
    @keyframes vtx-fade-up {
      from { opacity:0; transform:translateY(10px); }
      to   { opacity:1; transform:translateY(0);    }
    }

    /* ── Theme toggle ── */
  #themeToggle {
  position: fixed;
  bottom: 66px; /* Default: sits above the ticker (50px ticker + 16px gap) */
  left: 16px;
  z-index: 10001;
  width: 32px; height: 32px;
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.15);
  border: 1px solid rgba(255, 255, 255, 0.25);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-4);
  transition: background 0.14s, color 0.14s, border-color 0.14s, bottom 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: var(--shadow-sm);
  backdrop-filter: blur(12px) saturate(1.4);
  -webkit-backdrop-filter: blur(12px) saturate(1.4);
}
#themeToggle:hover {
  background: rgba(255, 255, 255, 0.28);
  color: var(--text-1);
  border-color: rgba(255, 255, 255, 0.45);
}
[data-theme="dark"] #themeToggle {
  background: rgba(20, 20, 24, 0.35);
  border-color: rgba(255, 255, 255, 0.1);
  color: var(--text-4);
}
[data-theme="dark"] #themeToggle:hover {
  background: rgba(255, 255, 255, 0.1);
  border-color: rgba(255, 255, 255, 0.2);
  color: var(--text-1);
}
/* When ticker is hidden, drop toggle down to natural bottom position */
#themeToggle.ticker-gone {
  bottom: 16px;
}
.theme-icon-dark  { display: block; }
.theme-icon-light { display: none; }
[data-theme="dark"] .theme-icon-dark  { display: none; }
[data-theme="dark"] .theme-icon-light { display: block; }
  </style>
</head>

<body>

  <!-- Loader controller -->
  <script>
    (function () {
      'use strict';
      var _bar    = document.getElementById('vtxBar');
      var _track  = document.getElementById('vtxTrack');
      var _status = document.getElementById('vtxStatus');
      var _dots   = document.getElementById('vtxDots');
      var _loader = document.getElementById('vtx-loader');
      var _pct    = 0;
      var _isDone = false;

      function _setProgress(pct, label) {
        if (_isDone) return;
        _pct = Math.min(100, Math.max(0, pct));
        if (_pct > 0 && _track) {
          _track.style.opacity = '1';
          if (_dots) _dots.style.opacity = '0';
        }
        if (_bar)           _bar.style.width    = _pct + '%';
        if (_status && label) _status.textContent = label;
      }

      function _done() {
        if (_isDone) return;
        _isDone = true;
        _setProgress(100, 'Ready');
        setTimeout(function () {
          if (_loader) _loader.classList.add('is-done');
          setTimeout(function () {
            if (_loader && _loader.parentNode) _loader.parentNode.removeChild(_loader);
          }, 650);
        }, 280);
      }

      window.VtxLoader = { progress: _setProgress, done: _done };
      setTimeout(function () { if (!_isDone) { console.warn('[VtxLoader] Failsafe.'); _done(); } }, 12000);
    }());
  </script>

  <!-- Theme controller -->
  <script>
    (function () {
      'use strict';
      function _apply(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('vtx-theme', theme);
      }
      function toggle() {
        var current = document.documentElement.getAttribute('data-theme') || 'light';
        _apply(current === 'dark' ? 'light' : 'dark');
      }
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function (e) {
        if (!localStorage.getItem('vtx-theme')) _apply(e.matches ? 'dark' : 'light');
      });
      window.VtxTheme = { toggle: toggle, apply: _apply };
    }());
  </script>

  <!-- Presentation enhancements -->
  <script>
    (function () {
      'use strict';

      function _patchExam() {
        if (!window.Exam || typeof window.Exam.renderExam !== 'function') {
          return setTimeout(_patchExam, 80);
        }
        var _orig = window.Exam.renderExam;
        window.Exam.renderExam = function () {
          _orig.apply(this, arguments);
          _setExamLayout(true);
          _stickyTimer();
        };
      }

      function _patchMount() {
        if (!window.UI || typeof window.UI.mount !== 'function') {
          return setTimeout(_patchMount, 80);
        }
        var _orig = window.UI.mount;
        window.UI.mount = function (html) {
          _orig.call(this, html);
          var inExam = window.AppState &&
                       window.AppState.exam &&
                       window.AppState.exam.step === 'exam';
          if (!inExam) _setExamLayout(false);
        };
      }

      function _setExamLayout(active) {
        var app = document.getElementById('app');
        if (!app) return;
        if (active) {
          app.style.display        = 'block';
          app.style.alignItems     = '';
          app.style.justifyContent = '';
          app.style.padding        = '0.75rem';
          app.classList.add('exam-active');
        } else {
          app.style.display        = '';
          app.style.alignItems     = '';
          app.style.justifyContent = '';
          app.style.padding        = '';
          app.classList.remove('exam-active');
        }
      }

      function _stickyTimer() {
        var app = document.getElementById('app');
        if (!app) return;
        var wrap = app.firstElementChild;
        if (!wrap) return;
        var header = wrap.querySelector('.glass:has(#timerDisplay)');
        if (!header) {
          header = Array.from(wrap.children).find(function (el) {
            return el.classList.contains('glass') && el.querySelector('#timerDisplay');
          });
        }
        if (!header) return;
        if (header.classList.contains('exam-header-sticky')) return;
        header.classList.add('exam-header-sticky');
        if (!('IntersectionObserver' in window)) return;
        var sentinel = document.createElement('div');
        sentinel.style.cssText = 'height:1px;pointer-events:none;visibility:hidden;';
        wrap.insertBefore(sentinel, header);
        if (window._stickyObs) window._stickyObs.disconnect();
        window._stickyObs = new IntersectionObserver(function (entries) {
          var el = document.querySelector('.exam-header-sticky');
          if (!el) return;
          el.classList.toggle('stuck', !entries[0].isIntersecting);
        }, { threshold: [0], rootMargin: '-1px 0px 0px 0px' });
        window._stickyObs.observe(sentinel);
      }

      document.addEventListener('keydown', function (e) {
        var tag = document.activeElement && document.activeElement.tagName;
        if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
        var exam = window.AppState && window.AppState.exam;
        if (!exam || exam.step !== 'exam') return;
        if (e.key === 'ArrowRight' || e.key === 'n' || e.key === 'N') {
          e.preventDefault(); window.Exam && window.Exam.nextQuestion();
        } else if (e.key === 'ArrowLeft' || e.key === 'p' || e.key === 'P') {
          e.preventDefault(); window.Exam && window.Exam.prevQuestion();
        } else if (e.key >= '1' && e.key <= '5') {
          var idx = parseInt(e.key, 10) - 1;
          var radios = document.querySelectorAll('input[name="option"]');
          if (radios[idx]) {
            radios[idx].checked = true;
            radios[idx].dispatchEvent(new Event('change', { bubbles: true }));
          }
        }
      });

      document.addEventListener('DOMContentLoaded', function () {
        _patchExam();
        _patchMount();
      });
    }());
  </script>

  <!-- Service Worker -->
  <script>
    (function () {
      'use strict';
      if (!('serviceWorker' in navigator)) return;
      var _swUpdateReady = false;

      function _registerSW() {
        navigator.serviceWorker
          .register('/sw.js', { scope: '/' })
          .then(function (reg) {
            console.log('[SW] Registered. Scope:', reg.scope);
            if (reg.waiting) _onUpdateReady(reg.waiting);
            reg.addEventListener('updatefound', function () {
              var nw = reg.installing;
              if (!nw) return;
              nw.addEventListener('statechange', function () {
                if (nw.state === 'installed' && navigator.serviceWorker.controller) {
                  _onUpdateReady(nw);
                }
              });
            });
          })
          .catch(function (err) { console.error('[SW] Registration failed:', err); });

        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (_swUpdateReady) window.location.reload();
        });
      }

      function _onUpdateReady(worker) {
        _swUpdateReady = true;
        function _show() {
          if (window.UI && typeof window.UI.showUpdateToast === 'function') {
            window.UI.showUpdateToast(function () {
              if (worker) worker.postMessage({ type: 'SKIP_WAITING' });
            });
          } else { setTimeout(_show, 500); }
        }
        _show();
      }

      if (document.readyState === 'loading') {
        window.addEventListener('load', _registerSW);
      } else {
        setTimeout(_registerSW, 0);
      }
    }());
  </script>
