<!DOCTYPE html>

  <!-- ============================================================
       LOADING SCREEN STYLES — inlined for first-paint
       ============================================================ -->
  <style>
    /* ── Loading overlay ── */
    #vtx-loader {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: #0e0e0f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      font-family: 'Georgia', serif;
      transition: opacity 0.55s cubic-bezier(0.4, 0, 0.2, 1),
                  visibility 0.55s cubic-bezier(0.4, 0, 0.2, 1);
      opacity: 1;
      visibility: visible;
    }

    #vtx-loader.is-done {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* Subtle warm radial glow */
    #vtx-loader::after {
      content: '';
      position: absolute;
      width: 480px;
      height: 480px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(181,100,30,.12) 0%, transparent 68%);
      pointer-events: none;
    }

    /* ── Book container ── */
    .vtx-book-wrap {
      position: relative;
      z-index: 1;
      margin-bottom: 2.5rem;
      animation: vtx-float 3.2s ease-in-out infinite;
    }

    .vtx-book {
      width: 88px;
      height: 68px;
      position: relative;
    }

    /* ── Page-turn animation ── */
    .vtx-page {
      position: absolute;
      top: 0;
      right: 50%;
      width: 42px;
      height: 64px;
      transform-origin: right center;
      transform-style: preserve-3d;
      animation: vtx-page-turn 1.9s ease-in-out infinite;
    }

    .vtx-page:nth-child(2) { animation-delay: 0.32s; opacity: 0.65; }
    .vtx-page:nth-child(3) { animation-delay: 0.64s; opacity: 0.38; }

    @keyframes vtx-page-turn {
      0%   { transform: rotateY(0deg);    }
      40%  { transform: rotateY(-160deg); }
      60%  { transform: rotateY(-160deg); }
      100% { transform: rotateY(0deg);    }
    }

    @keyframes vtx-float {
      0%, 100% { transform: translateY(0px); }
      50%       { transform: translateY(-7px); }
    }

    /* ── Brand text ── */
    .vtx-loader-title {
      position: relative;
      z-index: 1;
      font-family: 'Georgia', 'Times New Roman', serif;
      font-size: 1.375rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #f5f5f0;
      margin-bottom: 0.25rem;
      text-align: center;
    }

    .vtx-loader-subtitle {
      position: relative;
      z-index: 1;
      font-family: 'Georgia', serif;
      font-size: 0.6875rem;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: rgba(200, 195, 180, 0.5);
      margin-bottom: 2.25rem;
      text-align: center;
    }

    /* ── Progress track ── */
    .vtx-loader-track {
      position: relative;
      z-index: 1;
      width: 160px;
      height: 1px;
      background: rgba(255,255,255,.08);
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 1.25rem;
    }

    .vtx-loader-bar {
      height: 100%;
      width: 0%;
      border-radius: 99px;
      background: #b5641e;
      transition: width 0.4s ease;
      position: relative;
      overflow: hidden;
    }

    .vtx-loader-bar::after {
      content: '';
      position: absolute;
      top: 0; left: -100%; bottom: 0;
      width: 60%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.45), transparent);
      animation: vtx-shimmer 1.6s ease-in-out infinite;
    }

    @keyframes vtx-shimmer {
      0%   { left: -60%; }
      100% { left: 140%; }
    }

    /* ── Status text ── */
    .vtx-loader-status {
      position: relative;
      z-index: 1;
      font-family: 'Georgia', serif;
      font-size: 0.625rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(180, 175, 160, 0.5);
      text-align: center;
      min-height: 1em;
      transition: opacity 0.3s ease;
    }

    /* Dot pulse (before bar appears) */
    .vtx-dots {
      position: relative;
      z-index: 1;
      display: flex;
      gap: 5px;
      align-items: center;
      justify-content: center;
      margin-bottom: 0.5rem;
    }

    .vtx-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: rgba(181,100,30,.5);
      animation: vtx-dot-pulse 1.5s ease-in-out infinite;
    }

    .vtx-dot:nth-child(2) { animation-delay: 0.24s; }
    .vtx-dot:nth-child(3) { animation-delay: 0.48s; }

    @keyframes vtx-dot-pulse {
      0%, 80%, 100% { transform: scale(1);   opacity: 0.4; }
      40%            { transform: scale(1.6); opacity: 1;   }
    }
  </style>
</head>

<body>

        <line x1="11" y1="36" x2="36" y2="34" stroke="rgba(181,100,30,0.12)" stroke-width="1"/>

        <line x1="11" y1="52" x2="28" y2="50" stroke="rgba(181,100,30,0.08)" stroke-width="1"/>

        <line x1="52" y1="20" x2="77" y2="18" stroke="rgba(181,100,30,0.12)" stroke-width="1"/>
        <line x1="52" y1="28" x2="77" y2="26" stroke="rgba(181,100,30,0.12)" stroke-width="1"/>
        <line x1="52" y1="36" x2="77" y2="34" stroke="rgba(181,100,30,0.12)" stroke-width="1"/>

    <div class="vtx-loader-title">Vertex Tutorial</div>

    <div class="vtx-loader-status" id="vtxStatus">Preparing your session&hellip;</div>

  <!-- PWA Install Prompt -->
  <div id="install-prompt"
       style="display:none;position:fixed;bottom:16px;left:50%;transform:translateX(-50%);
              background:#fff;padding:1rem 1.5rem;border-radius:8px;
              box-shadow:0 6px 20px rgba(14,14,15,.12);z-index:9999;
              max-width:90%;text-align:center;border:1px solid #e4e2dc;">
    <p style="margin:0 0 10px;font-weight:600;color:#0e0e0f;font-family:'DM Sans',system-ui,sans-serif;font-size:0.875rem;">
      Install Vertex Tutorial App
    </p>
    <div style="display:flex;gap:8px;justify-content:center;">
      <button id="install-button"
              style="background:#0e0e0f;color:white;border:none;padding:6px 16px;
                     border-radius:4px;font-weight:600;cursor:pointer;font-family:'DM Sans',system-ui,sans-serif;font-size:0.8125rem;">
        Install
      </button>
      <button id="install-cancel"
              style="background:#f5f4f0;color:#48484c;border:1px solid #e4e2dc;padding:6px 16px;

        Later
      </button>
    </div>

  <!-- ============================================================
       LOADER CONTROLLER
       ============================================================ -->
  <script>
    (function () {
      'use strict';

      var _bar    = document.getElementById('vtxBar');
      var _track  = document.getElementById('vtxTrack');
      var _status = document.getElementById('vtxStatus');
      var _dots   = document.getElementById('vtxDots');
      var _loader = document.getElementById('vtx-loader');
      var _pct    = 0;
      var _done   = false;

      function _setProgress(pct, label) {
        if (_done) return;
        _pct = Math.min(100, Math.max(0, pct));
        if (_pct > 0 && _track) {
          _track.style.opacity = '1';
          if (_dots) _dots.style.opacity = '0';
        }
        if (_bar)    _bar.style.width  = _pct + '%';
        if (_status && label) _status.textContent = label;
      }

      function _done_fn() {
        if (_done) return;
        _done = true;
        _setProgress(100, 'Ready');
        setTimeout(function () {
          if (_loader) _loader.classList.add('is-done');
          setTimeout(function () {
            if (_loader && _loader.parentNode) {
              _loader.parentNode.removeChild(_loader);
            }
          }, 650);
        }, 280);
      }

      window.VtxLoader = {
        progress: _setProgress,
        done:     _done_fn,
      };

      // Failsafe
      setTimeout(function () {
        if (!_done) {
          console.warn('[VtxLoader] Failsafe triggered.');
          _done_fn();
        }
      }, 12000);

    }());
  </script>

  <!-- ============================================================
       PRESENTATION ENHANCEMENTS (unchanged logic)
       ============================================================ -->
  <script>
    (function () {
      'use strict';

      function _patchExam() {
        if (!window.Exam || typeof window.Exam.renderExam !== 'function') {
          return setTimeout(_patchExam, 80);
        }
        var _orig = window.Exam.renderExam;
        window.Exam.renderExam = function () {
          _orig.apply(this, arguments);
          _setExamLayout(true);
          _stickyTimer();
        };
      }

      function _patchMount() {
        if (!window.UI || typeof window.UI.mount !== 'function') {
          return setTimeout(_patchMount, 80);
        }
        var _orig = window.UI.mount;
        window.UI.mount = function (html) {
          _orig.call(this, html);
          var inExam = window.AppState &&
                       window.AppState.exam &&
                       window.AppState.exam.step === 'exam';
          if (!inExam) _setExamLayout(false);
        };
      }

      function _setExamLayout(active) {
        var app = document.getElementById('app');
        if (!app) return;
        if (active) {
          app.style.display        = 'block';
          app.style.alignItems     = '';
          app.style.justifyContent = '';
          app.style.padding        = '0.75rem';
          app.classList.add('exam-active');
        } else {
          app.style.display        = '';
          app.style.alignItems     = '';
          app.style.justifyContent = '';
          app.style.padding        = '';
          app.classList.remove('exam-active');
        }
      }

      function _stickyTimer() {
        var app = document.getElementById('app');
        if (!app) return;
        var wrap = app.firstElementChild;
        if (!wrap) return;

        var header = wrap.querySelector('.glass:has(#timerDisplay)');
        if (!header) {
          header = Array.from(wrap.children).find(function (el) {
            return el.classList.contains('glass') && el.querySelector('#timerDisplay');
          });
        }
        if (!header) return;
        if (header.classList.contains('exam-header-sticky')) return;

        header.classList.add('exam-header-sticky');

        if (!('IntersectionObserver' in window)) return;
        var sentinel = document.createElement('div');
        sentinel.style.cssText = 'height:1px;pointer-events:none;visibility:hidden;';
        wrap.insertBefore(sentinel, header);

        if (window._stickyObs) window._stickyObs.disconnect();
        window._stickyObs = new IntersectionObserver(function (entries) {
          var el = document.querySelector('.exam-header-sticky');
          if (!el) return;
          el.classList.toggle('stuck', !entries[0].isIntersecting);
        }, { threshold: [0], rootMargin: '-1px 0px 0px 0px' });
        window._stickyObs.observe(sentinel);
      }

      /* Keyboard shortcuts */
      document.addEventListener('keydown', function (e) {
        var tag = document.activeElement && document.activeElement.tagName;
        if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
        var exam = window.AppState && window.AppState.exam;
        if (!exam || exam.step !== 'exam') return;

        if (e.key === 'ArrowRight' || e.key === 'n' || e.key === 'N') {
          e.preventDefault();
          window.Exam && window.Exam.nextQuestion();
        } else if (e.key === 'ArrowLeft' || e.key === 'p' || e.key === 'P') {
          e.preventDefault();
          window.Exam && window.Exam.prevQuestion();
        } else if (e.key >= '1' && e.key <= '5') {
          var idx = parseInt(e.key, 10) - 1;
          var radios = document.querySelectorAll('input[name="option"]');
          if (radios[idx]) {
            radios[idx].checked = true;
            radios[idx].dispatchEvent(new Event('change', { bubbles: true }));
          }
        }
      });

      document.addEventListener('DOMContentLoaded', function () {
        _patchExam();
        _patchMount();
      });

    }());
  </script>

  <!-- Service Worker Registration -->
  <script>
    (function () {
      'use strict';

      if (!('serviceWorker' in navigator)) return;

      var _swUpdateReady  = false;
      var _swRegistration = null;

      function _registerSW() {
        navigator.serviceWorker
          .register('/sw.js', { scope: '/' })
          .then(function (reg) {
            _swRegistration = reg;
            console.log('[SW] Registered. Scope:', reg.scope);
            if (reg.waiting) _onUpdateReady(reg.waiting);
            reg.addEventListener('updatefound', function () {
              var nw = reg.installing;
              if (!nw) return;
              nw.addEventListener('statechange', function () {
                if (nw.state === 'installed' && navigator.serviceWorker.controller) {
                  _onUpdateReady(nw);
                }
              });
            });
          })
          .catch(function (err) { console.error('[SW] Registration failed:', err); });

        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (_swUpdateReady) window.location.reload();
        });
      }

      function _onUpdateReady(worker) {
        _swUpdateReady = true;
        function _show() {
          if (window.UI && typeof window.UI.showUpdateToast === 'function') {
            window.UI.showUpdateToast(function () {
              if (worker) worker.postMessage({ type: 'SKIP_WAITING' });
            });
          } else {
            setTimeout(_show, 500);
          }
        }
        _show();
      }

      if (document.readyState === 'loading') {
        window.addEventListener('load', _registerSW);
      } else {
        setTimeout(_registerSW, 0);
      }
    }());
  </script>
