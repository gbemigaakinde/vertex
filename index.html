          onload="window._katexAutoRenderReady = true;"></script>

  <style>
    /* ══════════════════════════════════════════════════════
       BOOK LOADING SCREEN
       ══════════════════════════════════════════════════════ */
    @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap');

    #vtx-loader {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: #0c0b09;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'DM Sans', system-ui, sans-serif;
      transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1),
                  visibility 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      opacity: 1;
      visibility: visible;
      overflow: hidden;
    }

    /* Subtle warm paper texture overlay */
    #vtx-loader::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% 40%, rgba(181,130,60,0.06) 0%, transparent 70%),
        radial-gradient(ellipse 40% 40% at 20% 80%, rgba(79,110,247,0.04) 0%, transparent 60%);
      pointer-events: none;
    }

    #vtx-loader.is-done {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* ── Book scene container ── */
    .vtx-book-scene {
      width: 220px;
      height: 160px;
      position: relative;
      margin-bottom: 2.5rem;
      perspective: 900px;
    }

    /* ── Book base (spine + back cover) ── */
    .vtx-book {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 140px;
      height: 120px;
      transform-style: preserve-3d;
    }

    /* Back cover — always visible as base */
    .vtx-book-back {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #2a1f10 0%, #1a1208 100%);
      border-radius: 3px 10px 10px 3px;
      box-shadow:
        -4px 4px 20px rgba(0,0,0,0.7),
        0 8px 32px rgba(0,0,0,0.5);
    }

    /* Spine */
    .vtx-book-spine {
      position: absolute;
      left: -12px;
      top: 0;
      width: 12px;
      height: 100%;
      background: linear-gradient(180deg, #4f3a1a 0%, #3a2a10 100%);
      border-radius: 3px 0 0 3px;
      box-shadow: -3px 4px 12px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
    }

    .vtx-spine-line {
      width: 2px;
      height: 40px;
      background: rgba(181,130,60,0.3);
      border-radius: 1px;
    }

    /* Front cover (closes over pages) */
    .vtx-book-front {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #3d2c14 0%, #2a1f0e 100%);
      border-radius: 3px 10px 10px 3px;
      transform-origin: left center;
      transform-style: preserve-3d;
      animation: vtx-cover-open 2.4s cubic-bezier(0.45, 0, 0.15, 1) 0.5s both;
      z-index: 10;
      box-shadow: 2px 0 8px rgba(0,0,0,0.4);
    }

    /* Front cover face */
    .vtx-book-front::before {
      content: '';
      position: absolute;
      inset: 6px;
      border: 1px solid rgba(181,130,60,0.25);
      border-radius: 2px 8px 8px 2px;
    }

    /* Cover title text */
    .vtx-cover-title {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      backface-visibility: hidden;
    }

    .vtx-cover-wordmark {
      font-family: 'Instrument Serif', Georgia, serif;
      font-size: 0.75rem;
      font-style: italic;
      color: rgba(220,185,110,0.8);
      letter-spacing: 0.06em;
      text-align: center;
      line-height: 1.3;
      padding: 0 12px;
    }

    .vtx-cover-rule {
      width: 40px;
      height: 1px;
      background: rgba(181,130,60,0.4);
    }

    .vtx-cover-sub {
      font-size: 0.45rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(181,130,60,0.45);
    }

    /* ── Pages fanning out ── */
    .vtx-page {
      position: absolute;
      inset: 0;
      border-radius: 3px 10px 10px 3px;
      transform-origin: left center;
      transform-style: preserve-3d;
    }

    /* Generate 6 pages with slightly different opening angles and delays */
    .vtx-page-1 {
      background: linear-gradient(90deg, #f0e8d5 0%, #ede0c4 100%);
      animation: vtx-page-fan-1 2.4s cubic-bezier(0.45, 0, 0.15, 1) 0.55s both;
      z-index: 9;
    }
    .vtx-page-2 {
      background: linear-gradient(90deg, #f2ead8 0%, #eee2c8 100%);
      animation: vtx-page-fan-2 2.4s cubic-bezier(0.45, 0, 0.15, 1) 0.6s both;
      z-index: 8;
    }
    .vtx-page-3 {
      background: linear-gradient(90deg, #f3ecda 0%, #f0e5cb 100%);
      animation: vtx-page-fan-3 2.4s cubic-bezier(0.45, 0, 0.15, 1) 0.65s both;
      z-index: 7;
    }
    .vtx-page-4 {
      background: linear-gradient(90deg, #f4eddb 0%, #f1e7cd 100%);
      animation: vtx-page-fan-4 2.4s cubic-bezier(0.45, 0, 0.15, 1) 0.7s both;
      z-index: 6;
    }
    .vtx-page-5 {
      background: linear-gradient(90deg, #f5eedc 0%, #f2e8ce 100%);
      animation: vtx-page-fan-5 2.4s cubic-bezier(0.45, 0, 0.15, 1) 0.75s both;
      z-index: 5;
    }
    .vtx-page-6 {
      background: linear-gradient(90deg, #f6efde 0%, #f3e9d0 100%);
      animation: vtx-page-fan-6 2.4s cubic-bezier(0.45, 0, 0.15, 1) 0.8s both;
      z-index: 4;
    }

    /* Lines on opened pages */
    .vtx-page::after {
      content: '';
      position: absolute;
      top: 16px;
      left: 16px;
      right: 12px;
      bottom: 16px;
      background: repeating-linear-gradient(
        to bottom,
        transparent,
        transparent 9px,
        rgba(181,130,60,0.12) 9px,
        rgba(181,130,60,0.12) 10px
      );
      border-radius: 0 4px 4px 0;
    }

    /* Cover opens to ~160deg (flat open) */
    @keyframes vtx-cover-open {
      0%   { transform: rotateY(0deg); }
      100% { transform: rotateY(-162deg); }
    }

    /* Each page fans to slightly different angle */
    @keyframes vtx-page-fan-1 {
      0%   { transform: rotateY(0deg); }
      100% { transform: rotateY(-148deg); }
    }
    @keyframes vtx-page-fan-2 {
      0%   { transform: rotateY(0deg); }
      100% { transform: rotateY(-132deg); }
    }
    @keyframes vtx-page-fan-3 {
      0%   { transform: rotateY(0deg); }
      100% { transform: rotateY(-114deg); }
    }
    @keyframes vtx-page-fan-4 {
      0%   { transform: rotateY(0deg); }
      100% { transform: rotateY(-94deg); }
    }
    @keyframes vtx-page-fan-5 {
      0%   { transform: rotateY(0deg); }
      100% { transform: rotateY(-72deg); }
    }
    @keyframes vtx-page-fan-6 {
      0%   { transform: rotateY(0deg); }
      100% { transform: rotateY(-50deg); }
    }

    /* ── Shadow under book ── */
    .vtx-book-shadow {
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-42%);
      width: 180px;
      height: 18px;
      background: radial-gradient(ellipse, rgba(0,0,0,0.55) 0%, transparent 70%);
      animation: vtx-shadow-grow 2.4s cubic-bezier(0.45, 0, 0.15, 1) 0.5s both;
    }

    @keyframes vtx-shadow-grow {
      0%   { width: 140px; opacity: 0.3; }
      100% { width: 210px; opacity: 1; }
    }

    /* ── Text below book ── */
    .vtx-loader-text {
      text-align: center;
      margin-bottom: 1.75rem;
      animation: vtx-fade-up 0.6s ease 0.3s both;
    }

    .vtx-loader-title {
      font-family: 'Instrument Serif', Georgia, serif;
      font-size: 1.25rem;
      font-style: italic;
      font-weight: 400;
      color: rgba(220,200,160,0.9);
      letter-spacing: -0.01em;
      margin-bottom: 0.25rem;
    }

    .vtx-loader-subtitle {
      font-size: 0.5625rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(160,140,100,0.4);
    }

    /* ── Progress bar ── */
    .vtx-progress-wrap {
      width: 200px;
      animation: vtx-fade-up 0.6s ease 0.5s both;
    }

    .vtx-loader-track {
      width: 100%;
      height: 2px;
      background: rgba(255,255,255,0.06);
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 0.75rem;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .vtx-loader-bar {
      height: 100%;
      width: 0%;
      border-radius: 99px;
      background: linear-gradient(90deg, #b58230 0%, #d4a550 100%);
      transition: width 0.45s ease;
      box-shadow: 0 0 8px rgba(181,130,60,0.5);
    }

    .vtx-loader-status {
      font-size: 0.625rem;
      letter-spacing: 0.08em;
      color: rgba(160,140,100,0.4);
      text-align: center;
      min-height: 1em;
      transition: opacity 0.3s ease;
    }

    /* Idle pulsing dots (shown before progress begins) */
    .vtx-dots {
      display: flex;
      gap: 5px;
      align-items: center;
      justify-content: center;
      margin-bottom: 0.625rem;
    }

    .vtx-dot {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: rgba(181,130,60,0.45);
      animation: vtx-dot-pulse 1.6s ease-in-out infinite;
    }
    .vtx-dot:nth-child(2) { animation-delay: 0.24s; }
    .vtx-dot:nth-child(3) { animation-delay: 0.48s; }

    /* ── Keyframes ── */
    @keyframes vtx-dot-pulse {
      0%, 80%, 100% { transform: scale(1); opacity: 0.35; }
      40% { transform: scale(1.7); opacity: 1; }
    }

    @keyframes vtx-fade-up {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Theme toggle button ── */
    #themeToggle {
      position: fixed;
      bottom: 16px;
      left: 16px;
      z-index: 9998;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-4);
      transition: background 0.14s, color 0.14s, border-color 0.14s;
      box-shadow: var(--shadow-sm);
    }

    #themeToggle:hover {
      background: var(--bg-muted);
      color: var(--text-1);
      border-color: var(--border-strong);
    }

    .theme-icon-dark  { display: block; }
    .theme-icon-light { display: none; }

    [data-theme="dark"] .theme-icon-dark  { display: none; }
    [data-theme="dark"] .theme-icon-light { display: block; }
  </style>
</head>

<body>

  <!-- Dark mode bootstrap script (must be synchronous) -->
  <script>
    (function() {
      const stored = localStorage.getItem('vtx-theme');
      if (stored === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      } else {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>

  <!-- ════════════════════════════════════════════════
       BOOK LOADING SCREEN
       ════════════════════════════════════════════════ -->

  <!-- Loader controller -->
  <script>
    (function () {
      'use strict';

      var _bar    = document.getElementById('vtxBar');
      var _track  = document.getElementById('vtxTrack');
      var _status = document.getElementById('vtxStatus');
      var _dots   = document.getElementById('vtxDots');
      var _loader = document.getElementById('vtx-loader');
      var _pct    = 0;
      var _isDone = false;

      function _setProgress(pct, label) {
        if (_isDone) return;
        _pct = Math.min(100, Math.max(0, pct));
        if (_pct > 0 && _track) {
          _track.style.opacity = '1';
          if (_dots) _dots.style.opacity = '0';
        }
        if (_bar)    _bar.style.width  = _pct + '%';
        if (_status && label) _status.textContent = label;
      }

      function _done() {
        if (_isDone) return;
        _isDone = true;
        _setProgress(100, 'Ready');
        setTimeout(function () {
          if (_loader) _loader.classList.add('is-done');
          setTimeout(function () {
            if (_loader && _loader.parentNode) _loader.parentNode.removeChild(_loader);
          }, 700);
        }, 280);
      }

      window.VtxLoader = { progress: _setProgress, done: _done };

      setTimeout(function () {
        if (!_isDone) { console.warn('[VtxLoader] Failsafe triggered.'); _done(); }
      }, 12000);
    }());
  </script>

  <!-- Theme controller -->
  <script>
    (function () {
      'use strict';

      function _apply(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('vtx-theme', theme);
      }

      function toggle() {
        const current = document.documentElement.getAttribute('data-theme') || 'light';
        _apply(current === 'dark' ? 'light' : 'dark');
      }

      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function (e) {
        if (!localStorage.getItem('vtx-theme')) {
          _apply(e.matches ? 'dark' : 'light');
        }
      });

      window.VtxTheme = { toggle: toggle, apply: _apply };
    }());
  </script>

  <!-- Presentation enhancements -->
  <script>
    (function () {
      'use strict';

      function _patchExam() {
        if (!window.Exam || typeof window.Exam.renderExam !== 'function') {
          return setTimeout(_patchExam, 80);
        }
        var _orig = window.Exam.renderExam;
        window.Exam.renderExam = function () {
          _orig.apply(this, arguments);
          _setExamLayout(true);
          _stickyTimer();
        };
      }

      function _patchMount() {
        if (!window.UI || typeof window.UI.mount !== 'function') {
          return setTimeout(_patchMount, 80);
        }
        var _orig = window.UI.mount;
        window.UI.mount = function (html) {
          _orig.call(this, html);
          var inExam = window.AppState &&
                       window.AppState.exam &&
                       window.AppState.exam.step === 'exam';
          if (!inExam) _setExamLayout(false);
        };
      }

      function _setExamLayout(active) {
        var app = document.getElementById('app');
        if (!app) return;
        if (active) {
          app.style.display        = 'block';
          app.style.alignItems     = '';
          app.style.justifyContent = '';
          app.style.padding        = '0.75rem';
          app.classList.add('exam-active');
        } else {
          app.style.display        = '';
          app.style.alignItems     = '';
          app.style.justifyContent = '';
          app.style.padding        = '';
          app.classList.remove('exam-active');
        }
      }

      function _stickyTimer() {
        var app = document.getElementById('app');
        if (!app) return;
        var wrap = app.firstElementChild;
        if (!wrap) return;

        var header = wrap.querySelector('.glass:has(#timerDisplay)');
        if (!header) {
          header = Array.from(wrap.children).find(function (el) {
            return el.classList.contains('glass') && el.querySelector('#timerDisplay');
          });
        }
        if (!header) return;
        if (header.classList.contains('exam-header-sticky')) return;

        header.classList.add('exam-header-sticky');

        if (!('IntersectionObserver' in window)) return;
        var sentinel = document.createElement('div');
        sentinel.style.cssText = 'height:1px;pointer-events:none;visibility:hidden;';
        wrap.insertBefore(sentinel, header);

        if (window._stickyObs) window._stickyObs.disconnect();
        window._stickyObs = new IntersectionObserver(function (entries) {
          var el = document.querySelector('.exam-header-sticky');
          if (!el) return;
          el.classList.toggle('stuck', !entries[0].isIntersecting);
        }, { threshold: [0], rootMargin: '-1px 0px 0px 0px' });
        window._stickyObs.observe(sentinel);
      }

      document.addEventListener('keydown', function (e) {
        var tag = document.activeElement && document.activeElement.tagName;
        if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
        var exam = window.AppState && window.AppState.exam;
        if (!exam || exam.step !== 'exam') return;

        if (e.key === 'ArrowRight' || e.key === 'n' || e.key === 'N') {
          e.preventDefault();
          window.Exam && window.Exam.nextQuestion();
        } else if (e.key === 'ArrowLeft' || e.key === 'p' || e.key === 'P') {
          e.preventDefault();
          window.Exam && window.Exam.prevQuestion();
        } else if (e.key >= '1' && e.key <= '5') {
          var idx = parseInt(e.key, 10) - 1;
          var radios = document.querySelectorAll('input[name="option"]');
          if (radios[idx]) {
            radios[idx].checked = true;
            radios[idx].dispatchEvent(new Event('change', { bubbles: true }));
          }
        }
      });

      document.addEventListener('DOMContentLoaded', function () {
        _patchExam();
        _patchMount();
      });
    }());
  </script>

  <!-- Service Worker -->
  <script>
    (function () {
      'use strict';

      if (!('serviceWorker' in navigator)) return;

      var _swUpdateReady  = false;
      var _swRegistration = null;

      function _registerSW() {
        navigator.serviceWorker
          .register('/sw.js', { scope: '/' })
          .then(function (reg) {
            _swRegistration = reg;
            console.log('[SW] Registered. Scope:', reg.scope);
            if (reg.waiting) _onUpdateReady(reg.waiting);
            reg.addEventListener('updatefound', function () {
              var nw = reg.installing;
              if (!nw) return;
              nw.addEventListener('statechange', function () {
                if (nw.state === 'installed' && navigator.serviceWorker.controller) {
                  _onUpdateReady(nw);
                }
              });
            });
          })
          .catch(function (err) { console.error('[SW] Registration failed:', err); });

        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (_swUpdateReady) window.location.reload();
        });
      }

      function _onUpdateReady(worker) {
        _swUpdateReady = true;
        function _show() {
          if (window.UI && typeof window.UI.showUpdateToast === 'function') {
            window.UI.showUpdateToast(function () {
              if (worker) worker.postMessage({ type: 'SKIP_WAITING' });
            });
          } else {
            setTimeout(_show, 500);
          }
        }
        _show();
      }

      if (document.readyState === 'loading') {
        window.addEventListener('load', _registerSW);
      } else {
        setTimeout(_registerSW, 0);
      }
    }());
  </script>

</body>
