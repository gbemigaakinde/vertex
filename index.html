<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Vertex Tutorial Centre</title>
  <meta name="description" content="Computer-Based Testing System for Vertex Tutorial students." />
  <meta name="author" content="Vertex Tutorial" />

  <!-- PWA -->
  <meta name="theme-color" content="#4f46e5" />
  <meta name="color-scheme" content="light" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="VertexCBT" />
  <link rel="apple-touch-icon" href="vertex.jpeg" />
  <link rel="apple-touch-icon" sizes="152x152" href="vertex.jpeg" />
  <link rel="apple-touch-icon" sizes="144x144" href="vertex.jpeg" />
  <link rel="apple-touch-icon" sizes="128x128" href="vertex.jpeg" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="vertex.jpeg" type="image/png" />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="news-ticker.css" />
  <link rel="stylesheet" href="css/styles.css" />

  <!--
    Tailwind CDN — synchronous, must not be deferred.
    Every JS module renders HTML using Tailwind utility classes.
    Our styles.css defines named custom classes on top.
  -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    if (window.tailwind) {
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              /* Override Tailwind's default sans with Outfit */
              sans: ['Outfit', 'Segoe UI', 'system-ui', '-apple-system', 'sans-serif'],
            },
          },
        },
      };
    }
  </script>

  <!-- =====================================================
       KaTeX — Option A math rendering
       
       LOAD ORDER IS CRITICAL — do not rearrange:
       
       1. katex.min.css    — styles (non-blocking link)
       2. katex.min.js     — core library   (defer)
       3. auto-render.js   — DOM scanner    (defer, depends on #2)
       
       Both JS files are `defer` so they execute after HTML
       parsing in document order — auto-render always loads
       after core. The onload on auto-render sets
       window._katexAutoRenderReady = true, which is the flag
       exam.js checks before calling renderMathInElement().
       
       DO NOT add crossorigin="anonymous" — it causes CORS
       failures on some mobile networks/proxies and silently
       prevents the scripts from executing.
       ===================================================== -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
          onload="window._katexAutoRenderReady = true;"></script>
</head>

<!--
  The Tailwind body gradient utility classes below are kept for
  compatibility. styles.css body rule uses !important to apply
  our background on top of them cleanly.
-->
<body class="bg-gradient-to-br from-indigo-50 via-white to-purple-50">

  <!-- Toast notification container — ID used by ui.js -->
  <div
    id="toastContainer"
    class="fixed top-6 right-6 z-50 space-y-3 max-w-sm w-full pointer-events-none"
    aria-live="polite"
    aria-atomic="false"
    role="status"
  ></div>

  <!-- Main app mount point — ID used by UI.mount() and all modules -->
  <div id="app" class="min-h-screen flex items-center justify-center p-6"></div>

  <!-- PWA Install Prompt -->
  <div id="install-prompt" style="display:none;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:white;padding:20px 28px;border-radius:16px;box-shadow:0 8px 32px rgba(0,0,0,.15);z-index:9999;max-width:90%;text-align:center;border:1px solid #e5e7eb;">
    <p style="margin:0 0 14px 0;font-weight:700;color:#1f2937;font-family:Outfit,sans-serif;font-size:.9375rem;">Install Vertex Tutorial App</p>
    <div style="display:flex;gap:8px;justify-content:center;">
      <button id="install-button" style="background:#4f46e5;color:white;border:none;padding:8px 20px;border-radius:8px;font-weight:600;cursor:pointer;font-family:Outfit,sans-serif;font-size:.875rem;">Install</button>
      <button id="install-cancel"  style="background:#f3f4f6;color:#4b5563;border:1px solid #e5e7eb;padding:8px 20px;border-radius:8px;cursor:pointer;font-family:Outfit,sans-serif;font-size:.875rem;">Later</button>
    </div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

  <!-- Application modules — load order is significant -->
  <script src="data/questions.js"></script>
  <script src="js/config.js"></script>
  <script src="js/state.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/tasks.js"></script>
  <script src="js/teacher.js"></script>
  <script src="js/exam.js"></script>
  <script src="js/app.js"></script>
  <script src="js/installPrompt.js"></script>
  <script src="news-ticker.js"></script>

  <!-- =====================================================
       PRESENTATION ENHANCEMENTS
       Purely visual layer. No logic, scoring, IDs touched.

       1. Sticky exam header (timer always on screen)
       2. #app layout switch between flex-center / block
       3. Keyboard shortcuts: ← → or P N (prev/next)
                               1 2 3 4 (select option)
       ===================================================== -->
  <script>
    (function () {
      'use strict';

      /* ── Patch Exam.renderExam ── */
      function _patchExam() {
        if (!window.Exam || typeof window.Exam.renderExam !== 'function') {
          return setTimeout(_patchExam, 80);
        }
        var _orig = window.Exam.renderExam;
        window.Exam.renderExam = function () {
          _orig.apply(this, arguments);
          _setExamLayout(true);
          _stickyTimer();
        };
      }

      /* ── Patch UI.mount ── */
      function _patchMount() {
        if (!window.UI || typeof window.UI.mount !== 'function') {
          return setTimeout(_patchMount, 80);
        }
        var _orig = window.UI.mount;
        window.UI.mount = function (html) {
          _orig.call(this, html);
          var inExam = window.AppState &&
                       window.AppState.exam &&
                       window.AppState.exam.step === 'exam';
          if (!inExam) _setExamLayout(false);
        };
      }

      /* ── Toggle #app between flex-center and block ── */
      function _setExamLayout(active) {
        var app = document.getElementById('app');
        if (!app) return;
        if (active) {
          app.style.display        = 'block';
          app.style.alignItems     = '';
          app.style.justifyContent = '';
          app.style.padding        = '1.5rem';
          app.classList.add('exam-active');
        } else {
          app.style.display        = '';
          app.style.alignItems     = '';
          app.style.justifyContent = '';
          app.style.padding        = '';
          app.classList.remove('exam-active');
        }
      }

      /* ── Make the exam header card sticky ──
         exam.js renders:
           <div class="max-w-4xl mx-auto p-4 flex flex-col gap-6">   ← wrap
             <div class="glass p-6 rounded-3xl ...">                  ← header (has #timerDisplay)
             <div class="glass p-8 rounded-3xl">                      ← question
         We add .exam-header-sticky to the first child glass div.
      */
      function _stickyTimer() {
        var app = document.getElementById('app');
        if (!app) return;
        var wrap = app.firstElementChild;
        if (!wrap) return;
        // Find the glass card that contains the timer (may not be firstElementChild
        // now that the student info bar is inserted before it)
        var header = wrap.querySelector('.glass:has(#timerDisplay)');
        if (!header) {
          // Fallback for browsers without :has() support
          header = Array.from(wrap.children).find(function(el) {
            return el.classList.contains('glass') && el.querySelector('#timerDisplay');
          });
        }
        if (!header) return;
        if (header.classList.contains('exam-header-sticky')) return;

        header.classList.add('exam-header-sticky');

        /* Scroll observer: add .stuck shadow when header pins */
        if (!('IntersectionObserver' in window)) return;
        var sentinel = document.createElement('div');
        sentinel.style.cssText = 'height:1px;pointer-events:none;visibility:hidden;';
        wrap.insertBefore(sentinel, header);

        if (window._stickyObs) window._stickyObs.disconnect();
        window._stickyObs = new IntersectionObserver(function (entries) {
          var el = document.querySelector('.exam-header-sticky');
          if (!el) return;
          el.classList.toggle('stuck', !entries[0].isIntersecting);
        }, { threshold: [0], rootMargin: '-1px 0px 0px 0px' });
        window._stickyObs.observe(sentinel);
      }

      /* ── Keyboard shortcuts ── */
      document.addEventListener('keydown', function (e) {
        var tag = document.activeElement && document.activeElement.tagName;
        if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
        var exam = window.AppState && window.AppState.exam;
        if (!exam || exam.step !== 'exam') return;

        if (e.key === 'ArrowRight' || e.key === 'n' || e.key === 'N') {
          e.preventDefault();
          window.Exam && window.Exam.nextQuestion();
        } else if (e.key === 'ArrowLeft' || e.key === 'p' || e.key === 'P') {
          e.preventDefault();
          window.Exam && window.Exam.prevQuestion();
        } else if (e.key >= '1' && e.key <= '5') {
          var idx = parseInt(e.key, 10) - 1;
          var radios = document.querySelectorAll('input[name="option"]');
          if (radios[idx]) {
            radios[idx].checked = true;
            radios[idx].dispatchEvent(new Event('change', { bubbles: true }));
          }
        }
      });

      document.addEventListener('DOMContentLoaded', function () {
        _patchExam();
        _patchMount();
      });

    }());
  </script>

  <!-- =====================================================
       SERVICE WORKER REGISTRATION
       Must remain inline after all module scripts.
       ===================================================== -->
  <script>
    (function () {
      'use strict';

      if (!('serviceWorker' in navigator)) return;

      var _swUpdateReady  = false;
      var _swRegistration = null;

      function _registerSW() {
        navigator.serviceWorker
          .register('/sw.js', { scope: '/' })
          .then(function (reg) {
            _swRegistration = reg;
            console.log('[SW] Registered. Scope:', reg.scope);
            if (reg.waiting) _onUpdateReady(reg.waiting);
            reg.addEventListener('updatefound', function () {
              var nw = reg.installing;
              if (!nw) return;
              nw.addEventListener('statechange', function () {
                if (nw.state === 'installed' && navigator.serviceWorker.controller) {
                  _onUpdateReady(nw);
                }
              });
            });
          })
          .catch(function (err) { console.error('[SW] Registration failed:', err); });

        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (_swUpdateReady) window.location.reload();
        });
      }

      function _onUpdateReady(worker) {
        _swUpdateReady = true;
        function _show() {
          if (window.UI && typeof window.UI.showUpdateToast === 'function') {
            window.UI.showUpdateToast(function () {
              if (worker) worker.postMessage({ type: 'SKIP_WAITING' });
            });
          } else {
            setTimeout(_show, 500);
          }
        }
        _show();
      }

      if (document.readyState === 'loading') {
        window.addEventListener('load', _registerSW);
      } else {
        setTimeout(_registerSW, 0);
      }
    }());
  </script>

</body>
</html>
