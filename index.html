<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- =====================================================
       PRIMARY META
       ===================================================== -->
  <title>Vertex Tutorial Centre</title>
  <meta name="description" content="Computer-Based Testing System for Vertex Tutorial students." />
  <meta name="author" content="Vertex Tutorial" />

  <!-- =====================================================
       PWA — Theme and display
       ===================================================== -->
  <meta name="theme-color" content="#1a0845" />
  <meta name="color-scheme" content="light" />

  <!-- =====================================================
       PWA — iOS Safari
       ===================================================== -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="VertexCBT" />
  <link rel="apple-touch-icon" href="vertex.jpeg" />
  <link rel="apple-touch-icon" sizes="152x152" href="vertex.jpeg" />
  <link rel="apple-touch-icon" sizes="144x144" href="vertex.jpeg" />
  <link rel="apple-touch-icon" sizes="128x128" href="vertex.jpeg" />

  <!-- =====================================================
       PWA — Web App Manifest
       ===================================================== -->
  <link rel="manifest" href="/manifest.json" />

  <!-- =====================================================
       FAVICON
       ===================================================== -->
  <link rel="icon" href="vertex.jpeg" type="image/png" />

  <!-- =====================================================
       STYLESHEETS
       news-ticker.css and styles.css are precached by SW.
       Tailwind is CDN-loaded; cached via stale-while-revalidate.
       ===================================================== -->
  <link rel="stylesheet" href="news-ticker.css" />
  <link rel="stylesheet" href="css/styles.css" />

  <!--
    Tailwind CDN — must execute synchronously before DOM renders.
    All JS-generated HTML uses Tailwind utility classes extensively.
    styles.css defines our custom class names ON TOP of Tailwind.
  -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    if (window.tailwind) {
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              /*
               * Override Tailwind's default sans stack with Sora.
               * Applies to all font-sans usages in generated HTML.
               */
              sans: ['Sora', 'Segoe UI', 'system-ui', '-apple-system', 'sans-serif'],
            },
          },
        },
      };
    }
  </script>

  <!-- KaTeX -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex-auto-render.min.js"
          onload="window._katexAutoRenderReady = true;"></script>
</head>

<!--
  NOTE: Tailwind's bg-gradient utility classes on <body> are intentionally
  kept here for compatibility. Our styles.css body rule uses !important
  on background-color and background-image to apply the deep violet theme
  on top of them. Both coexist correctly.
-->
<body class="bg-gradient-to-br from-indigo-50 via-white to-purple-50">

  <!-- Toast notification container -->
  <div
    id="toastContainer"
    class="fixed top-6 right-6 z-50 space-y-3 max-w-sm w-full pointer-events-none"
    aria-live="polite"
    aria-atomic="false"
    role="status"
  ></div>

  <!-- Main app mount point -->
  <div id="app" class="min-h-screen flex items-center justify-center p-6"></div>

  <!-- PWA Install Prompt -->
  <div id="install-prompt" style="display: none; position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(255,255,255,0.96); padding: 16px 24px; border-radius: 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.28); z-index: 9999; max-width: 90%; text-align: center; backdrop-filter: blur(16px); border: 1px solid rgba(167,139,250,0.3);">
    <p style="margin: 0 0 12px 0; font-weight: 700; color: #1e0a4a; font-family: Sora, sans-serif;">Install Vertex Tutorial App</p>
    <div style="display: flex; gap: 8px; justify-content: center;">
      <button id="install-button" class="btn text-sm px-5 py-2">Install</button>
      <button id="install-cancel" style="background:rgba(100,116,139,0.12); color:#475569; border:1.5px solid rgba(148,163,184,0.4); font-family:Sora,sans-serif; font-weight:600; font-size:0.875rem; padding:0.5rem 1.25rem; border-radius:0.875rem; cursor:pointer;">Later</button>
    </div>
  </div>

  <!-- =====================================================
       FIREBASE SDKs
       ===================================================== -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

  <!-- Application modules — load order is significant -->
  <script src="data/questions.js"></script>
  <script src="js/config.js"></script>
  <script src="js/state.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/tasks.js"></script>
  <script src="js/teacher.js"></script>
  <script src="js/exam.js"></script>
  <script src="js/app.js"></script>
  <script src="js/installPrompt.js"></script>
  <script src="news-ticker.js"></script>

  <!-- =====================================================
       PRESENTATION ENHANCEMENTS
       Purely visual — zero changes to exam logic, scoring,
       timer, submission, or any IDs referenced by JS modules.

       What this does:
       1. Makes exam header card sticky (timer always visible)
       2. Switches #app between flex-center and block layout
       3. Adds keyboard shortcuts (←/→ for prev/next, 1-4 for options)
       4. Adds scroll shadow to sticky header
       ===================================================== -->
  <script>
    (function () {
      'use strict';

      /* ─────────────────────────────────────────────────
         1. Patch Exam.renderExam — purely presentation
            Wait for Exam module to be defined, then wrap it.
         ───────────────────────────────────────────────── */
      function _patchExamModule() {
        if (!window.Exam || typeof window.Exam.renderExam !== 'function') {
          setTimeout(_patchExamModule, 80);
          return;
        }

        var _origRender = window.Exam.renderExam;

        window.Exam.renderExam = function () {
          /* Run all original exam rendering logic first */
          _origRender.apply(this, arguments);

          /* Then apply layout and sticky header */
          _activateExamLayout();
          _makeTimerSticky();
        };
      }

      /* ─────────────────────────────────────────────────
         2. Patch UI.mount — restores flex-center on
            non-exam screens (login, subject selection, etc.)
         ───────────────────────────────────────────────── */
      function _patchUiModule() {
        if (!window.UI || typeof window.UI.mount !== 'function') {
          setTimeout(_patchUiModule, 80);
          return;
        }

        var _origMount = window.UI.mount;

        window.UI.mount = function (html) {
          /* Run original mount */
          _origMount.call(this, html);

          /* Decide layout based on exam step */
          var exam = window.AppState && window.AppState.exam;
          if (!exam || exam.step !== 'exam') {
            _deactivateExamLayout();
          }
        };
      }

      /* ─────────────────────────────────────────────────
         3. Activate exam layout on #app
         ───────────────────────────────────────────────── */
      function _activateExamLayout() {
        var app = document.getElementById('app');
        if (!app) return;
        /* Remove Tailwind flex centering (added by Tailwind utility classes) */
        app.style.display         = 'block';
        app.style.alignItems      = '';
        app.style.justifyContent  = '';
        app.style.padding         = '1.5rem';
        app.classList.add('exam-active');
      }

      function _deactivateExamLayout() {
        var app = document.getElementById('app');
        if (!app) return;
        app.style.display         = '';
        app.style.alignItems      = '';
        app.style.justifyContent  = '';
        app.style.padding         = '';
        app.classList.remove('exam-active');
      }

      /* ─────────────────────────────────────────────────
         4. Make the exam header card (first .glass child
            of #app containing #timerDisplay) sticky so
            the timer is always on screen.
         ───────────────────────────────────────────────── */
      function _makeTimerSticky() {
        var app = document.getElementById('app');
        if (!app) return;

        /* exam.js renders:
             <div class="max-w-4xl ...">           ← outerWrap
               <div class="glass p-6 ...">         ← header card (has #timerDisplay)
               <div class="glass p-8 ...">         ← question card
               ...
        */
        var outerWrap = app.firstElementChild;
        if (!outerWrap) return;

        var firstCard = outerWrap.firstElementChild;
        if (!firstCard) return;

        /* Only sticky the card that holds the timer */
        if (!firstCard.querySelector('#timerDisplay')) return;

        /* Already patched */
        if (firstCard.classList.contains('exam-header-sticky')) return;

        firstCard.classList.add('exam-header-sticky');

        /* IntersectionObserver: add .stuck shadow when card hits top */
        if ('IntersectionObserver' in window) {
          /* Sentinel pixel above the card */
          var sentinel = document.createElement('div');
          sentinel.style.cssText =
            'height:1px; margin-bottom:-1px; pointer-events:none;';
          outerWrap.insertBefore(sentinel, firstCard);

          if (window._examStickyObserver) {
            window._examStickyObserver.disconnect();
          }

          window._examStickyObserver = new IntersectionObserver(
            function (entries) {
              var card = document.querySelector('.exam-header-sticky');
              if (!card) return;
              if (!entries[0].isIntersecting) {
                card.classList.add('stuck');
              } else {
                card.classList.remove('stuck');
              }
            },
            { threshold: [0], rootMargin: '-1px 0px 0px 0px' }
          );

          window._examStickyObserver.observe(sentinel);
        }
      }

      /* ─────────────────────────────────────────────────
         5. Keyboard shortcuts (presentation only)
            ←/→ or P/N = previous/next question
            1/2/3/4    = select option A/B/C/D
         ───────────────────────────────────────────────── */
      document.addEventListener('keydown', function (e) {
        /* Never fire when user is typing in an input */
        var active = document.activeElement;
        if (active) {
          var t = active.tagName;
          if (t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT') return;
        }

        /* Only during an active exam */
        var exam = window.AppState && window.AppState.exam;
        if (!exam || exam.step !== 'exam') return;

        switch (e.key) {
          case 'ArrowRight':
          case 'n':
          case 'N':
            e.preventDefault();
            if (window.Exam && window.Exam.nextQuestion) {
              window.Exam.nextQuestion();
            }
            break;

          case 'ArrowLeft':
          case 'p':
          case 'P':
            e.preventDefault();
            if (window.Exam && window.Exam.prevQuestion) {
              window.Exam.prevQuestion();
            }
            break;

          case '1': case '2': case '3': case '4': case '5':
            var optIdx = parseInt(e.key, 10) - 1;
            var radios = document.querySelectorAll('input[name="option"]');
            if (radios[optIdx]) {
              radios[optIdx].checked = true;
              radios[optIdx].dispatchEvent(
                new Event('change', { bubbles: true })
              );
            }
            break;
        }
      });

      /* ─────────────────────────────────────────────────
         Start all patches after DOM is ready
         ───────────────────────────────────────────────── */
      document.addEventListener('DOMContentLoaded', function () {
        _patchExamModule();
        _patchUiModule();
      });

    }());
  </script>

  <!-- =====================================================
       SERVICE WORKER REGISTRATION
       Placed after all application scripts so that
       AppState, UI, etc. are defined before the SW
       controller change handler fires.

       IMPORTANT: This script must remain inline here and
       must not be moved to a separate file.
       ===================================================== -->
  <script>
    (function () {
      'use strict';

      if (!('serviceWorker' in navigator)) return;

      var _swUpdateReady   = false;
      var _swRegistration  = null;

      function _registerSW() {
        navigator.serviceWorker
          .register('/sw.js', { scope: '/' })
          .then(function (reg) {
            _swRegistration = reg;
            console.log('[SW] Registered. Scope:', reg.scope);

            if (reg.waiting) {
              _onUpdateReady(reg.waiting);
            }

            reg.addEventListener('updatefound', function () {
              var newWorker = reg.installing;
              if (!newWorker) return;

              newWorker.addEventListener('statechange', function () {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  _onUpdateReady(newWorker);
                }
              });
            });
          })
          .catch(function (err) {
            console.error('[SW] Registration failed:', err);
          });

        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (_swUpdateReady) {
            window.location.reload();
          }
        });
      }

      function _onUpdateReady(worker) {
        _swUpdateReady = true;

        function _showUpdateToast() {
          if (window.UI && typeof window.UI.showUpdateToast === 'function') {
            window.UI.showUpdateToast(function onConfirm() {
              if (worker) {
                worker.postMessage({ type: 'SKIP_WAITING' });
              }
            });
          } else {
            setTimeout(_showUpdateToast, 500);
          }
        }

        _showUpdateToast();
      }

      if (document.readyState === 'loading') {
        window.addEventListener('load', _registerSW);
      } else {
        setTimeout(_registerSW, 0);
      }

    }());
  </script>

</body>
</html>
