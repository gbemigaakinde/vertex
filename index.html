    /* ══════════════════════════════════════════════════════
       VERTEX CBT — LOADING SCREEN  v3

    @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap');

    #vtx-loader {
      position: fixed; inset: 0; z-index: 99999;
      background: #fafaf8;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-family: 'DM Sans', system-ui, sans-serif;
      transition: opacity 0.55s cubic-bezier(0.4,0,0.2,1), visibility 0.55s cubic-bezier(0.4,0,0.2,1);
    }
    #vtx-loader::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(ellipse 80% 60% at 50% 50%, transparent 40%, rgba(14,14,15,0.03) 100%);
      pointer-events: none;
    }
    #vtx-loader.is-done { opacity: 0; visibility: hidden; pointer-events: none; }
    [data-theme="dark"] #vtx-loader { background: #111113; }
    [data-theme="dark"] #vtx-loader::before {
      background: radial-gradient(ellipse 80% 60% at 50% 50%, rgba(79,110,247,0.05) 0%, transparent 60%);
    }

    /* Book */
    .vtx-book-scene {
      position: relative; width: 320px; height: 160px; margin-bottom: 2.75rem;
      perspective: 900px; perspective-origin: 50% 50%;
      display: flex; align-items: flex-end; justify-content: center;
    }
    .vtx-book {
      position: relative; width: 140px; height: 120px;
      transform-style: preserve-3d;
      animation: vtx-book-shift 2.6s cubic-bezier(0.45,0,0.15,1) 0.4s both;
      flex-shrink: 0;
    }
    @keyframes vtx-book-shift { 0%{transform:translateX(0)} 100%{transform:translateX(52px)} }

    .vtx-book-back {
      position: absolute; inset: 0;
      background: linear-gradient(140deg,#1c1c20 0%,#0e0e0f 100%);
      border-radius: 3px 10px 10px 3px;
      box-shadow: 0 8px 28px rgba(14,14,15,.18), 0 2px 6px rgba(14,14,15,.12);
    }
    [data-theme="dark"] .vtx-book-back { background: linear-gradient(140deg,#2a2a30 0%,#18181b 100%); }

    .vtx-book-spine {
      position: absolute; left: -12px; top: 0; width: 12px; height: 100%;
      background: linear-gradient(180deg,#2a2a30 0%,#0e0e0f 100%);
      border-radius: 3px 0 0 3px; box-shadow: -3px 4px 12px rgba(14,14,15,.2);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    }
    [data-theme="dark"] .vtx-book-spine { background: linear-gradient(180deg,#3a3a42 0%,#18181b 100%); }
    .vtx-spine-line { width: 2px; border-radius: 1px; background: rgba(79,110,247,0.4); }

    .vtx-book-front {
      position: absolute; inset: 0;
      background: linear-gradient(140deg,#1c1c20 0%,#0e0e0f 100%);
      border-radius: 3px 10px 10px 3px;
      transform-origin: left center; transform-style: preserve-3d;
      animation: vtx-cover-open 2.6s cubic-bezier(0.45,0,0.15,1) 0.4s both; z-index: 10;
    }
    [data-theme="dark"] .vtx-book-front { background: linear-gradient(140deg,#2a2a30 0%,#18181b 100%); }
    .vtx-book-front::before { content:'';position:absolute;inset:7px;border:1px solid rgba(79,110,247,.22);border-radius:2px 8px 8px 2px; }
    .vtx-cover-title { position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;backface-visibility:hidden; }
    .vtx-cover-wordmark { font-family:'Instrument Serif',Georgia,serif;font-size:.75rem;font-style:italic;color:rgba(250,250,248,.75);letter-spacing:.04em;text-align:center;line-height:1.3;padding:0 14px; }
    .vtx-cover-rule { width:36px;height:1px;background:rgba(79,110,247,.45); }
    .vtx-cover-sub { font-size:.4375rem;letter-spacing:.24em;text-transform:uppercase;color:rgba(79,110,247,.55); }

    .vtx-page {

  <!-- Loader controller -->
  <script>
    (function () {
      'use strict';
      var _bar    = document.getElementById('vtxBar');
      var _track  = document.getElementById('vtxTrack');
      var _status = document.getElementById('vtxStatus');
      var _dots   = document.getElementById('vtxDots');
      var _loader = document.getElementById('vtx-loader');
      var _pct    = 0;
      var _isDone = false;

      function _setProgress(pct, label) {
        if (_isDone) return;
        _pct = Math.min(100, Math.max(0, pct));
        if (_pct > 0 && _track) {
          _track.style.opacity = '1';
          if (_dots) _dots.style.opacity = '0';
        }
        if (_bar)           _bar.style.width    = _pct + '%';
        if (_status && label) _status.textContent = label;
      }

      function _done() {
        if (_isDone) return;
        _isDone = true;
        _setProgress(100, 'Ready');
        setTimeout(function () {
          if (_loader) _loader.classList.add('is-done');
          setTimeout(function () {
            if (_loader && _loader.parentNode) _loader.parentNode.removeChild(_loader);
          }, 650);
        }, 280);
      }

      window.VtxLoader = { progress: _setProgress, done: _done };
      setTimeout(function () { if (!_isDone) { console.warn('[VtxLoader] Failsafe.'); _done(); } }, 12000);
    }());
  </script>

  <!-- Theme controller -->
  <script>
    (function () {
      'use strict';
      function _apply(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('vtx-theme', theme);
      }
      function toggle() {
        var current = document.documentElement.getAttribute('data-theme') || 'light';
        _apply(current === 'dark' ? 'light' : 'dark');
      }
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function (e) {
        if (!localStorage.getItem('vtx-theme')) _apply(e.matches ? 'dark' : 'light');
      });
      window.VtxTheme = { toggle: toggle, apply: _apply };
    }());
  </script>
  
  <!-- Howler.js for sound effects -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.4/howler.min.js"></script>

  <!-- VtxSound: minimal sound engine -->
  <script>
    (function () {
      'use strict';

      // All sounds are generated via Web Audio API — no external files needed.
      // Howler is loaded for mobile unlock support only.

      var _ctx = null;
      var _unlocked = false;
      var _enabled = true;

      function _getCtx() {
        if (!_ctx) {
          try {
            _ctx = new (window.AudioContext || window.webkitAudioContext)();
          } catch (e) {
            console.warn('[VtxSound] Web Audio not supported.');
            return null;
          }
        }
        return _ctx;
      }

      // Unlock audio context on first user gesture (required for mobile)
      function _unlock() {
        if (_unlocked) return;
        var ctx = _getCtx();
        if (!ctx) return;
        if (ctx.state === 'suspended') {
          ctx.resume().catch(function () {});
        }
        _unlocked = true;
      }
      document.addEventListener('click',     _unlock, { once: true, passive: true });
      document.addEventListener('touchstart', _unlock, { once: true, passive: true });
      document.addEventListener('keydown',   _unlock, { once: true, passive: true });

      // Core tone player
      // notes: array of { freq, start, dur, vol }
      // type: 'sine' | 'triangle' | 'square'
      function _playTones(notes, type) {
        if (!_enabled) return;
        var ctx = _getCtx();
        if (!ctx) return;
        if (ctx.state === 'suspended') ctx.resume().catch(function () {});

        notes.forEach(function (n) {
          try {
            var osc  = ctx.createOscillator();
            var gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);

            osc.type      = type || 'sine';
            osc.frequency.setValueAtTime(n.freq, ctx.currentTime + n.start);

            var vol = n.vol !== undefined ? n.vol : 0.18;
            gain.gain.setValueAtTime(0, ctx.currentTime + n.start);
            gain.gain.linearRampToValueAtTime(vol, ctx.currentTime + n.start + 0.01);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + n.start + n.dur);

            osc.start(ctx.currentTime + n.start);
            osc.stop(ctx.currentTime + n.start + n.dur + 0.05);
          } catch (e) {}
        });
      }

      // ── Individual sounds ───────────────────────────────────

      // Welcome: warm ascending chime (login)
      function welcome() {
        _playTones([
          { freq: 523, start: 0.00, dur: 0.35, vol: 0.14 },
          { freq: 659, start: 0.18, dur: 0.35, vol: 0.14 },
          { freq: 784, start: 0.36, dur: 0.55, vol: 0.16 },
        ], 'sine');
      }

      // Success: bright short ding
      function success() {
        _playTones([
          { freq: 784, start: 0.00, dur: 0.18, vol: 0.14 },

  <!-- Presentation enhancements -->
  <script>
    (function () {
      'use strict';

      function _patchExam() {
        if (!window.Exam || typeof window.Exam.renderExam !== 'function') {
          return setTimeout(_patchExam, 80);
        }
        var _orig = window.Exam.renderExam;
        window.Exam.renderExam = function () {
          _orig.apply(this, arguments);
          _setExamLayout(true);
          _stickyTimer();
          if (window.SpeechEngine) SpeechEngine.injectExamButtons();
        };
      }

      function _patchMount() {
        if (!window.UI || typeof window.UI.mount !== 'function') {
          return setTimeout(_patchMount, 80);
        }
        var _orig = window.UI.mount;
        window.UI.mount = function (html) {
          _orig.call(this, html);
          var inExam = window.AppState &&
                       window.AppState.exam &&
                       window.AppState.exam.step === 'exam';
          if (!inExam) _setExamLayout(false);
        };
      }

      function _setExamLayout(active) {
        var app = document.getElementById('app');
        if (!app) return;
        if (active) {
          app.style.display        = 'block';
          app.style.alignItems     = '';
          app.style.justifyContent = '';
          app.style.padding        = '0.75rem';
          app.classList.add('exam-active');
        } else {
          app.style.display        = '';
          app.style.alignItems     = '';
          app.style.justifyContent = '';
          app.style.padding        = '';
          app.classList.remove('exam-active');
        }
      }

      function _stickyTimer() {
        var app = document.getElementById('app');
        if (!app) return;
        var wrap = app.firstElementChild;
        if (!wrap) return;
        var header = wrap.querySelector('.glass:has(#timerDisplay)');
        if (!header) {
          header = Array.from(wrap.children).find(function (el) {
            return el.classList.contains('glass') && el.querySelector('#timerDisplay');
          });
        }
        if (!header) return;
        if (header.classList.contains('exam-header-sticky')) return;
        header.classList.add('exam-header-sticky');
        if (!('IntersectionObserver' in window)) return;
        var sentinel = document.createElement('div');
        sentinel.style.cssText = 'height:1px;pointer-events:none;visibility:hidden;';
        wrap.insertBefore(sentinel, header);
        if (window._stickyObs) window._stickyObs.disconnect();
        window._stickyObs = new IntersectionObserver(function (entries) {
          var el = document.querySelector('.exam-header-sticky');
          if (!el) return;
          el.classList.toggle('stuck', !entries[0].isIntersecting);
        }, { threshold: [0], rootMargin: '-1px 0px 0px 0px' });
        window._stickyObs.observe(sentinel);
      }

      document.addEventListener('keydown', function (e) {
        var tag = document.activeElement && document.activeElement.tagName;
        if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
        var exam = window.AppState && window.AppState.exam;
        if (!exam || exam.step !== 'exam') return;
        if (e.key === 'ArrowRight' || e.key === 'n' || e.key === 'N') {
          e.preventDefault(); window.Exam && window.Exam.nextQuestion();
        } else if (e.key === 'ArrowLeft' || e.key === 'p' || e.key === 'P') {
          e.preventDefault(); window.Exam && window.Exam.prevQuestion();
        } else if (e.key >= '1' && e.key <= '5') {
          var idx    = parseInt(e.key, 10) - 1;
          var labels = document.querySelectorAll('.option-label');
          if (labels[idx]) labels[idx].click();
          } else if (e.key === 'r' || e.key === 'R') {
          e.preventDefault();
          if (window.SpeechEngine) SpeechEngine.readCurrentQuestion();
        } else if (e.key === 'm' || e.key === 'M') {
          e.preventDefault();
          if (window.SpeechEngine) SpeechEngine.startListening();
        }
      });

      document.addEventListener('DOMContentLoaded', function () {
        _patchExam();
        _patchMount();
      });
    }());
  </script>

  <!-- Service Worker -->
  <script>
    (function () {
      'use strict';
      if (!('serviceWorker' in navigator)) return;
      var _swUpdateReady = false;
      function _registerSW() {
        navigator.serviceWorker
          .register('/sw.js', { scope: '/' })
          .then(function (reg) {
            console.log('[SW] Registered. Scope:', reg.scope);
            if (reg.waiting) _onUpdateReady(reg.waiting);
            reg.addEventListener('updatefound', function () {
              var nw = reg.installing;
              if (!nw) return;
              nw.addEventListener('statechange', function () {
                if (nw.state === 'installed' && navigator.serviceWorker.controller) _onUpdateReady(nw);
              });
            });
          })
          .catch(function (err) { console.error('[SW] Registration failed:', err); });
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (_swUpdateReady) window.location.reload();
        });
      }
      function _onUpdateReady(worker) {
        _swUpdateReady = true;
        function _show() {
          if (window.UI && typeof window.UI.showUpdateToast === 'function') {
            window.UI.showUpdateToast(function () {
              if (worker) worker.postMessage({ type: 'SKIP_WAITING' });
            });
          } else { setTimeout(_show, 500); }
        }
        _show();
      }
      if (document.readyState === 'loading') { window.addEventListener('load', _registerSW); }
      else { setTimeout(_registerSW, 0); }
    }());
  </script>
