<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- =====================================================
       PRIMARY META
       ===================================================== -->
  <title>Vertex Tutorial Centre</title>
  <meta name="description" content="Computer-Based Testing System for Vertex Tutorial students." />
  <meta name="author" content="Vertex Tutorial" />

  <!-- =====================================================
       PWA — Theme and display
       ===================================================== -->
  <meta name="theme-color" content="#0f1729" />
  <meta name="color-scheme" content="light" />

  <!-- =====================================================
       PWA — iOS Safari
       ===================================================== -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="VertexCBT" />
  <link rel="apple-touch-icon" href="vertex.jpeg" />
  <link rel="apple-touch-icon" sizes="152x152" href="vertex.jpeg" />
  <link rel="apple-touch-icon" sizes="144x144" href="vertex.jpeg" />
  <link rel="apple-touch-icon" sizes="128x128" href="vertex.jpeg" />

  <!-- =====================================================
       PWA — Web App Manifest
       ===================================================== -->
  <link rel="manifest" href="/manifest.json" />

  <!-- =====================================================
       FAVICON
       ===================================================== -->
  <link rel="icon" href="vertex.jpeg" type="image/png" />

  <!-- =====================================================
       STYLESHEETS
       ===================================================== -->
  <link rel="stylesheet" href="news-ticker.css" />
  <link rel="stylesheet" href="css/styles.css" />

  <!--
    Tailwind CDN — provides utility classes for JS-generated HTML
    that still uses Tailwind class names (e.g. exam.js, teacher.js).
    Keep synchronous to avoid FOUC.
  -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    if (window.tailwind) {
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Plus Jakarta Sans', 'Segoe UI', 'system-ui', '-apple-system', 'sans-serif'],
            },
          },
        },
      };
    }
  </script>

  <!-- KaTeX for math rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex-auto-render.min.js"
          onload="window._katexAutoRenderReady = true;"></script>
</head>

<body>

  <!-- =====================================================
       ACCESSIBILITY — Skip link
       ===================================================== -->
  <a href="#mainContent" class="skip-link">Skip to exam content</a>

  <!-- =====================================================
       EXAM HEADER — Fixed, always visible during exam
       Populated by exam.js via JS (IDs preserved)
       Hidden on login/selection screens via JS
       ===================================================== -->
  <header id="examHeader" style="display:none" aria-label="Exam status bar">
    <div class="exam-header-inner">

      <!-- Candidate identity (left) -->
      <div class="exam-header-identity" id="headerIdentity">
        <span class="exam-header-name" id="headerName">—</span>
        <span class="exam-header-meta" id="headerMeta">—</span>
      </div>

      <!-- Current subject (centre) -->
      <div class="exam-header-subject" id="headerSubject" aria-label="Current subject"></div>

      <!-- Timer (right) -->
      <div class="exam-header-timer-zone">
        <div
          id="timerDisplay"
          class="timer-green"
          aria-live="polite"
          aria-label="Time remaining"
          role="timer"
        >02:00:00</div>
        <span class="timer-label">remaining</span>
      </div>

    </div>
  </header>

  <!-- =====================================================
       EXAM PROGRESS BAR — sits immediately below the header
       Width is updated by exam.js
       ===================================================== -->
  <div id="examProgressBar" style="display:none" aria-hidden="true">
    <div id="examProgressFill" style="width:0%"></div>
  </div>

  <!-- =====================================================
       TOAST NOTIFICATION CONTAINER
       ===================================================== -->
  <div
    id="toastContainer"
    aria-live="polite"
    aria-atomic="false"
    role="status"
  ></div>

  <!-- =====================================================
       MAIN APP MOUNT POINT
       exam.js / auth.js / teacher.js render into here.
       The id="app" is used by UI.mount() — do not rename.
       ===================================================== -->
  <main id="app" class="page-center" id="mainContent" tabindex="-1">
    <!-- Content injected by JS modules -->
  </main>

  <!-- =====================================================
       PWA INSTALL PROMPT
       ===================================================== -->
  <div id="install-prompt" style="display:none; position:fixed; bottom:20px; left:50%; transform:translateX(-50%); padding:1.25rem 1.5rem; z-index:9999; max-width:92%; text-align:center; width:340px;">
    <p style="margin:0 0 0.875rem 0; font-weight:700; font-size:0.9375rem; color:#0f1729; font-family:'Plus Jakarta Sans',sans-serif;">Install Vertex Tutorial App</p>
    <div style="display:flex; gap:0.625rem; justify-content:center;">
      <button id="install-button" class="btn btn-sm" style="background:#4f46e5; color:white; font-family:'Plus Jakarta Sans',sans-serif;">Install</button>
      <button id="install-cancel"  class="btn btn-sm btn-secondary" style="font-family:'Plus Jakarta Sans',sans-serif;">Later</button>
    </div>
  </div>

  <!-- =====================================================
       FIREBASE SDKs
       ===================================================== -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

  <!-- =====================================================
       APPLICATION MODULES — load order matters
       ===================================================== -->
  <script src="data/questions.js"></script>
  <script src="js/config.js"></script>
  <script src="js/state.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/tasks.js"></script>
  <script src="js/teacher.js"></script>
  <script src="js/exam.js"></script>
  <script src="js/app.js"></script>
  <script src="js/installPrompt.js"></script>
  <script src="news-ticker.js"></script>

  <!-- =====================================================
       EXAM HEADER SYNC HELPER
       Keeps the fixed header in sync with the exam state.
       Called by exam.js after renderExam() completes.

       The helper reads AppState directly so exam.js does
       not need to be modified — it just needs to call
       window._syncExamHeader() after each renderExam call,
       OR we patch renderExam via a thin wrapper below.
       ===================================================== -->
  <script>
    (function () {
      'use strict';

      /* ── Sync the fixed header with current exam state ── */
      window._syncExamHeader = function () {
        var exam = window.AppState && window.AppState.exam;
        if (!exam || exam.step !== 'exam') {
          _hideHeader();
          return;
        }

        var header  = document.getElementById('examHeader');
        var progBar = document.getElementById('examProgressBar');
        if (header)  header.style.display  = '';
        if (progBar) progBar.style.display = '';

        /* Identity */
        var sd = window.AppState.studentData || {};
        var nameEl = document.getElementById('headerName');
        var metaEl = document.getElementById('headerMeta');
        if (nameEl) nameEl.textContent = sd.name  || '';
        if (metaEl) metaEl.textContent = (sd.class || '') + (sd.school ? ' · ' + sd.school : '');

        /* Subject */
        var subjEl = document.getElementById('headerSubject');
        if (subjEl) subjEl.textContent = exam.currentSubject || '';

        /* Progress fill */
        var fillEl = document.getElementById('examProgressFill');
        if (fillEl) {
          var subjects = exam.subjects || [];
          var total = 0, answered = 0;
          subjects.forEach(function (s) {
            var qs = (exam.questions || {})[s] || [];
            total += qs.length;
            qs.forEach(function (_, i) {
              if ((exam.answers || {})[s + '-' + i] !== undefined) answered++;
            });
          });
          fillEl.style.width = total > 0 ? ((answered / total) * 100).toFixed(1) + '%' : '0%';
        }

        /* Update app main padding to clear the fixed header */
        var appEl = document.getElementById('app');
        if (appEl) {
          appEl.style.paddingTop = '0';
          appEl.classList.remove('page-center');
        }
      };

      window._hideHeader = function () {
        var header  = document.getElementById('examHeader');
        var progBar = document.getElementById('examProgressBar');
        if (header)  header.style.display  = 'none';
        if (progBar) progBar.style.display = 'none';

        /* Restore page-center layout for login/selection screens */
        var appEl = document.getElementById('app');
        if (appEl) {
          appEl.classList.add('page-center');
        }
      };

      /*
       * Patch Exam.renderExam to call _syncExamHeader after render.
       * We wait for DOMContentLoaded so Exam is guaranteed to be defined.
       */
      document.addEventListener('DOMContentLoaded', function () {
        setTimeout(function () {
          if (window.Exam && typeof window.Exam.renderExam === 'function') {
            var _origRender = window.Exam.renderExam;
            window.Exam.renderExam = function () {
              _origRender.apply(this, arguments);
              window._syncExamHeader();
            };
          }

          /* Also hide header whenever UI.mount is called (non-exam screens) */
          if (window.UI && typeof window.UI.mount === 'function') {
            var _origMount = window.UI.mount;
            window.UI.mount = function (html) {
              _origMount.call(this, html);
              /* Only hide if we're not in exam step */
              var exam = window.AppState && window.AppState.exam;
              if (!exam || exam.step !== 'exam') {
                window._hideHeader();
              }
            };
          }
        }, 0);
      });

    }());
  </script>

  <!-- =====================================================
       SERVICE WORKER REGISTRATION
       Must remain inline here after all module scripts.
       ===================================================== -->
  <script>
    (function () {
      'use strict';

      if (!('serviceWorker' in navigator)) return;

      var _swUpdateReady  = false;
      var _swRegistration = null;

      function _registerSW() {
        navigator.serviceWorker
          .register('/sw.js', { scope: '/' })
          .then(function (reg) {
            _swRegistration = reg;
            console.log('[SW] Registered. Scope:', reg.scope);

            if (reg.waiting) {
              _onUpdateReady(reg.waiting);
            }

            reg.addEventListener('updatefound', function () {
              var newWorker = reg.installing;
              if (!newWorker) return;

              newWorker.addEventListener('statechange', function () {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  _onUpdateReady(newWorker);
                }
              });
            });
          })
          .catch(function (err) {
            console.error('[SW] Registration failed:', err);
          });

        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (_swUpdateReady) {
            window.location.reload();
          }
        });
      }

      function _onUpdateReady(worker) {
        _swUpdateReady = true;

        function _showUpdateToast() {
          if (window.UI && typeof window.UI.showUpdateToast === 'function') {
            window.UI.showUpdateToast(function onConfirm() {
              if (worker) {
                worker.postMessage({ type: 'SKIP_WAITING' });
              }
            });
          } else {
            setTimeout(_showUpdateToast, 500);
          }
        }

        _showUpdateToast();
      }

      if (document.readyState === 'loading') {
        window.addEventListener('load', _registerSW);
      } else {
        setTimeout(_registerSW, 0);
      }

    }());
  </script>

</body>
</html>
