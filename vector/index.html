<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <title>VECTOR: BLACKLINE</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#05080a">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2305080a'/%3E%3Cpath d='M12 14l20 36 20-36' fill='none' stroke='%23f0a33a' stroke-width='7' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="../css/vector-blackline.css">
  <style>
    /* Page shell only. All game styling lives in css/vector-blackline.css, scoped to .vector-blackline */
    html, body { margin: 0; height: 100%; background: #05080a; overflow: hidden; }
    noscript { display: block; color: #e4e9ee; font: 16px system-ui, sans-serif; padding: 24px; }
  </style>
</head>
<body>
  <div id="vectorBlacklineRoot"></div>
  <noscript>VECTOR: BLACKLINE needs JavaScript. Please turn it on and reload.</noscript>

  <!-- Same Firebase project as Vertex. config.js initialises it, so the player is already signed in. -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script src="../js/config.js"></script>

  <script type="module">
    import VectorBlackline from './index.js';
    VectorBlackline.init({ vertexUrl: '../index.html', keepRoot: true });
    VectorBlackline.open();
  </script>
</body>
</html>
