<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>VAPID Key Generator</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 2rem auto; padding: 1rem; }
    textarea { width: 100%; height: 80px; font-family: monospace; font-size: .8rem; }
    button { padding: .75rem 1.5rem; font-size: 1rem; cursor: pointer; margin-top: 1rem; }
    label { display: block; margin-top: 1rem; font-weight: bold; }
  </style>
</head>
<body>
  <h2>VAPID Key Generator</h2>
  <p>Click the button once. Copy both keys. Never share the private key.</p>
  <button onclick="generateKeys()">Generate VAPID Keys</button>
  <label>Public Key (paste into js/notifications.js):</label>
  <textarea id="pubKey" readonly></textarea>
  <label>Private Key (paste into Cloudflare Worker secret VAPID_PRIVATE_KEY):</label>
  <textarea id="privKey" readonly></textarea>
  <script>
    async function generateKeys() {
      var keyPair = await crypto.subtle.generateKey(
        { name: 'ECDH', namedCurve: 'P-256' },
        true,
        ['deriveKey', 'deriveBits']
      );
      var pubRaw  = await crypto.subtle.exportKey('raw',  keyPair.publicKey);
      var privJwk = await crypto.subtle.exportKey('jwk',  keyPair.privateKey);
      function toBase64Url(buf) {
        var bytes = new Uint8Array(buf);
        var binary = '';
        for (var i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
        return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      }
      document.getElementById('pubKey').value  = toBase64Url(pubRaw);
      document.getElementById('privKey').value = JSON.stringify(privJwk);
    }
  </script>
</body>
</html>
